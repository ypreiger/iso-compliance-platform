---
# OpenShift flavor — Doc-Agent (document parsing + generation microservice)
# Builds from local source via binary strategy; uses OpenShift Routes for ingress.
#
# Model endpoints are configured via ConfigMap (model-config.yaml).
# Swap model URLs to point at OpenShift AI InferenceService for on-prem models.
#
# Apply: oc apply -f deploy/openshift/base/
# Build: oc start-build iso-docgen --from-dir=services/docgen --wait --follow
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iso-docgen
  namespace: iso-platform
  labels:
    app.kubernetes.io/name: iso-docgen
    app.kubernetes.io/component: doc-agent
    app.kubernetes.io/part-of: iso-compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iso-docgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-docgen
    spec:
      containers:
        - name: doc-agent
          image: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-docgen:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: doc-agent-model-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: LLM_API_KEY
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: iso-docgen
  namespace: iso-platform
  labels:
    app.kubernetes.io/name: iso-docgen
spec:
  selector:
    app.kubernetes.io/name: iso-docgen
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: iso-docgen
  namespace: iso-platform
  annotations:
    haproxy.router.openshift.io/timeout: "300s"
spec:
  to:
    kind: Service
    name: iso-docgen
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
