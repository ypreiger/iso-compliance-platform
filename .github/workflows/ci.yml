name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          pip install pytest pyyaml fastapi httpx psycopg[binary] uvicorn pydantic-settings
          pip install -r apps/iso-api/requirements.txt
          pip install -r services/rag-iso/requirements.txt

      - name: RAG local verify
        run: ./scripts/verify-rag-local.sh

      - name: Pytest
        run: |
          export USE_SQLITE=1
          export SQLITE_PATH=/tmp/iso-ci.db
          export AUTH_DEV_MODE=1
          export ADMIN_EMAILS=yaakovpreiger@gmail.com,valeria.preiger@gmail.com
          pip install -r apps/iso-api/requirements.txt pytest pyyaml
          pip install -r services/rag-iso/requirements.txt
          PYTHONPATH=apps/iso-api:services/rag-iso pytest -q apps/iso-api/tests services/rag-iso/tests

      - name: iso-web build
        run: |
          cd apps/iso-web && npm ci && npm run build

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      - name: Kustomize build (dry)
        run: |
          for d in gitops/layers/*/; do
            kubectl kustomize "$d" > /dev/null
          done
          kubectl kustomize gitops/root > /dev/null
