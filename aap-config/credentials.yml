---
controller_credential_types:
  - name: ACS Central API
    description: ACS Central REST API token
    kind: cloud
    inputs:
      fields:
        - id: acs_url
          type: string
          label: ACS URL
        - id: acs_token
          type: string
          label: ACS Token
          secret: true
      required: [acs_url, acs_token]
    injectors:
      env:
        ACS_URL: "{{ '{{ acs_url }}' }}"
        ACS_TOKEN: "{{ '{{ acs_token }}' }}"
        ACS_VALIDATE_CERTS: "false"
  - name: AAP API
    description: Controller API for schedules (JT-04/JT-06)
    kind: cloud
    inputs:
      fields:
        - id: aap_url
          type: string
          label: AAP URL
        - id: aap_token
          type: string
          label: AAP Token
          secret: true
      required: [aap_url, aap_token]
    injectors:
      env:
        AAP_URL: "{{ '{{ aap_url }}' }}"
        AAP_TOKEN: "{{ '{{ aap_token }}' }}"
        AAP_API_BASE: "{{ '{{ aap_url }}' }}/api/controller/v2"
        CONTROLLER_HOST: "{{ '{{ aap_url }}' }}"
