apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  namespace: iso-platform
  labels:
    app: anthropic-claude-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-server-view
  namespace: iso-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: model-server
  namespace: iso-platform
