apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-playground
  namespace: iso-platform
  labels:
    app: claude-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-playground
  template:
    metadata:
      labels:
        app: claude-playground
    spec:
      serviceAccountName: model-server
      containers:
      - name: playground
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install --quiet anthropic google-cloud-aiplatform flask
            
            cat > /app/playground.py << 'PYTHON_EOF'
            from flask import Flask, request, jsonify, render_template_string
            from anthropic import AnthropicVertex
            import os
            
            app = Flask(__name__)
            
            project_id = os.environ.get("VERTEX_AI_PROJECT_ID")
            region = os.environ.get("VERTEX_AI_REGION")
            client = AnthropicVertex(project_id=project_id, region=region)
            
            HTML_TEMPLATE = '''
            <!DOCTYPE html>
            <html>
            <head>
                <title>Claude Playground</title>
                <style>
                    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
                    textarea { width: 100%; height: 100px; margin: 10px 0; }
                    button { padding: 10px 20px; background: #0066cc; color: white; border: none; cursor: pointer; }
                    button:hover { background: #0052a3; }
                    .response { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
                    .info { background: #e3f2fd; padding: 10px; margin: 10px 0; border-radius: 5px; }
                </style>
            </head>
            <body>
                <h1>🤖 Claude Playground - Vertex AI</h1>
                <div class="info">
                    <strong>Project:</strong> {{ project_id }}<br>
                    <strong>Region:</strong> {{ region }}<br>
                    <strong>Model:</strong> Claude 3.5 Sonnet
                </div>
                <textarea id="prompt" placeholder="Enter your message here...">Hello Claude! How are you today?</textarea>
                <button onclick="sendMessage()">Send Message</button>
                <div id="response"></div>
                
                <script>
                async function sendMessage() {
                    const prompt = document.getElementById('prompt').value;
                    const responseDiv = document.getElementById('response');
                    responseDiv.innerHTML = '<div class="response">Thinking...</div>';
                    
                    try {
                        const response = await fetch('/chat', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({message: prompt})
                        });
                        const data = await response.json();
                        responseDiv.innerHTML = '<div class="response">' + data.response + '</div>';
                    } catch (error) {
                        responseDiv.innerHTML = '<div class="response" style="background:#ffebee;">Error: ' + error + '</div>';
                    }
                }
                </script>
            </body>
            </html>
            '''
            
            @app.route('/')
            def home():
                return render_template_string(HTML_TEMPLATE, project_id=project_id, region=region)
            
            @app.route('/chat', methods=['POST'])
            def chat():
                data = request.json
                user_message = data.get('message', '')
                
                message = client.messages.create(
                    model="claude-3-5-sonnet@20240620",
                    max_tokens=1024,
                    messages=[{"role": "user", "content": user_message}]
                )
                
                return jsonify({'response': message.content[0].text})
            
            @app.route('/health')
            def health():
                return jsonify({'status': 'healthy'})
            
            if __name__ == '__main__':
                app.run(host='0.0.0.0', port=8080)
            PYTHON_EOF
            
            mkdir -p /app
            python /app/playground.py
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/secrets/google/key.json
        - name: VERTEX_AI_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: anthropic-vertex-credentials
              key: VERTEX_AI_PROJECT_ID
        - name: VERTEX_AI_REGION
          valueFrom:
            secretKeyRef:
              name: anthropic-vertex-credentials
              key: VERTEX_AI_REGION
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: gcp-credentials
          mountPath: /var/secrets/google
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
      volumes:
      - name: gcp-credentials
        secret:
          secretName: anthropic-vertex-credentials
          items:
          - key: GCP_CREDENTIALS
            path: key.json
---
apiVersion: v1
kind: Service
metadata:
  name: claude-playground
  namespace: iso-platform
spec:
  selector:
    app: claude-playground
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: claude-playground
  namespace: iso-platform
spec:
  to:
    kind: Service
    name: claude-playground
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
