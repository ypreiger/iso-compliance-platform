apiVersion: v1
kind: Secret
metadata:
  name: anthropic-vertex-credentials
  namespace: iso-platform
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: "vertex-ai"
    openshift.io/display-name: "Anthropic Claude Credentials"
type: Opaque
stringData:
  VERTEX_AI_PROJECT_ID: "itpc-gcp-global-revenue-claude"
  VERTEX_AI_REGION: "us-east5"
  VERTEX_AI_ENDPOINT: "us-east5-aiplatform.googleapis.com"
  MODEL_NAME: "claude-3-5-sonnet@20240620"
  PROVIDER: "anthropic-vertex"
  # Replace with your actual GCP service account JSON
  GCP_CREDENTIALS: |
    {
      "type": "service_account",
      "project_id": "itpc-gcp-global-revenue-claude",
      "private_key_id": "REPLACE_WITH_KEY_ID",
      "private_key": "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_PRIVATE_KEY\n-----END PRIVATE KEY-----\n",
      "client_email": "REPLACE_WITH_SA@PROJECT.iam.gserviceaccount.com",
      "client_id": "REPLACE_WITH_CLIENT_ID",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/REPLACE_WITH_SA%40PROJECT.iam.gserviceaccount.com",
      "universe_domain": "googleapis.com"
    }
