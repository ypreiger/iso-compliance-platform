apiVersion: v1
kind: Secret
metadata:
  name: anthropic-claude-vertex
  namespace: iso-platform
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: "s3"
    openshift.io/display-name: "Anthropic Claude - Vertex AI"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "not-used"
  AWS_SECRET_ACCESS_KEY: "not-used"
  AWS_S3_ENDPOINT: "https://us-east5-aiplatform.googleapis.com"
  AWS_S3_BUCKET: "models"
  AWS_DEFAULT_REGION: "us-east5"
