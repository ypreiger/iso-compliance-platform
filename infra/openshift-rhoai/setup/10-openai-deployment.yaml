apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-playground
  namespace: iso-platform
  labels:
    app: claude-playground
    component: maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-playground
  template:
    metadata:
      labels:
        app: claude-playground
        component: maas
    spec:
      serviceAccountName: model-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: registry.access.redhat.com/ubi9/python-311:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        workingDir: /opt/app-root/src
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install --no-cache-dir openai flask gunicorn
            cp /config/app.py /opt/app-root/src/app.py
            exec gunicorn -w 2 -b 0.0.0.0:8080 --timeout 120 app:app
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: OPENAI_API_KEY
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: app-code
          mountPath: /config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: app-code
        configMap:
          name: claude-api-app
