apiVersion: v1
kind: ConfigMap
metadata:
  name: iso-app-config
  labels:
    app.kubernetes.io/component: app-infra
data:
  DATABASE_HOST: "postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "iso"
  DATABASE_USER: "iso"
  REDIS_URL: "redis://iso-redis:6379/0"
  LLM_GATEWAY_URL: "https://api.openai.com/v1"
  LLM_MODEL_MAPPING: "gpt-4-turbo"
  LLM_MODEL_REPORT: "gpt-4"
  LLM_MODEL_EMBED: "text-embedding-3-small"
  MAAS_BASE_URL: "https://maas.apps.ocp.8mkwb.sandbox3159.opentlc.com"
  MAAS_MODEL_LOCAL: "qwen3-4b-instruct"
  # Qwen3 OpenAI-compatible endpoint (via MaaS gateway, requires Bearer SA token)
  QWEN3_MODEL_URL: "https://maas.apps.ocp.8mkwb.sandbox3159.opentlc.com/llm/qwen3-4b-instruct/v1"
  QWEN3_MODEL_NAME: "qwen3-4b-instruct"
  # Guardrails endpoint (set after GuardrailsOrchestrator is Ready)
  GUARDRAILS_ENDPOINT: ""
  RHOAI_DASHBOARD_URL: "https://rhods-dashboard-redhat-ods-applications.apps.ocp.8mkwb.sandbox3159.opentlc.com"
  # Update doc-agent to use Qwen3 for EXTRACT and TRANSLATE tasks
  EXTRACT_MODEL_URL: "https://maas.apps.ocp.8mkwb.sandbox3159.opentlc.com/llm/qwen3-4b-instruct/v1"
  EXTRACT_MODEL_NAME: "qwen3-4b-instruct"
  TRANSLATE_MODEL_URL: "https://api.openai.com/v1"
  TRANSLATE_MODEL_NAME: "gpt-4o"
  RAG_MANIFEST_PATH: "/seed/RAG/manifest.yaml"
  AUTH_DEV_MODE: "0"
  ADMIN_EMAILS: "yaakov.preiger@think-21.com,yaakovpreiger@gmail.com,valeria.preiger@gmail.com"
  ISO_WEB_URL: "https://iso-web-iso-platform.apps.ocp.8mkwb.sandbox3159.opentlc.com"
  DOCGEN_URL: "http://iso-docgen:8080"
  GIT_REPO_URL: "https://github.com/ypreiger/iso-compliance-platform.git"
  GIT_REPO_REVISION: "main"
  SAML_IDP_ENTITY_ID: "https://accounts.google.com/o/saml2?idpid=C03huz8l6"
  SAML_IDP_SSO_URL: "https://accounts.google.com/o/saml2/idp?idpid=C03huz8l6"
  SAML_SP_ENTITY_ID: "https://iso-web-iso-platform.apps.ocp.8mkwb.sandbox3159.opentlc.com/api/auth/saml/metadata"
  SAML_SP_ACS_URL: "https://iso-web-iso-platform.apps.ocp.8mkwb.sandbox3159.opentlc.com/api/auth/saml/acs"
  GOOGLE_CLIENT_ID: ""
