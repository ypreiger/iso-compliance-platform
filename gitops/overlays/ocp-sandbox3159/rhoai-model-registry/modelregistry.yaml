apiVersion: v1
kind: Secret
metadata:
  name: rhoai-demo-registry-db
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: iso-compliance-platform
stringData:
  database-password: "registry-demo-pass"
---
# Lives in the DSC-configured registries namespace so it appears under
# AI hub → Model registry. 3.5.1 persists kubeRBACProxy (not oauthProxy).
apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  name: rhoai-demo
  namespace: rhoai-model-registries
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: iso-compliance-platform
  annotations:
    openshift.io/display-name: Demo model registry
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  rest:
    port: 8080
    serviceRoute: disabled
  grpc:
    port: 9090
  postgres:
    generateDeployment: true
    database: modelregistry
    username: mlregistryuser
    passwordSecret:
      name: rhoai-demo-registry-db
      key: database-password
    port: 5432
    skipDBCreation: false
    sslMode: disable
  kubeRBACProxy:
    port: 8443
    routePort: 443
    serviceRoute: enabled
