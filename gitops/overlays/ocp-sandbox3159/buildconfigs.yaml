apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: iso-api
  labels:
    app.kubernetes.io/name: iso-api
spec:
  source:
    type: Git
    git:
      uri: https://github.com/ypreiger/iso-compliance-platform.git
      ref: main
    contextDir: apps/iso-api
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: iso-api:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
