apiVersion: v1
kind: Namespace
metadata:
  name: rhoai-demo
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
    opendatahub.io/project-type: default
    kubernetes.io/metadata.name: rhoai-demo
    app.kubernetes.io/part-of: iso-compliance-platform
    app.kubernetes.io/component: rhoai-demo
  annotations:
    openshift.io/display-name: RHOAI 3.5 demo
    openshift.io/description: Connected demo project for Red Hat OpenShift AI 3.5 GA and Technology Preview (AutoRAG, Gen AI Studio, pipelines, MLflow, EvalHub, Feature Store, MCP, OGX).
    opendatahub.io/display-name: RHOAI 3.5 demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admins-edit
  namespace: rhoai-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhods-admins
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admins-admin
  namespace: rhoai-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhods-admins
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: admin
