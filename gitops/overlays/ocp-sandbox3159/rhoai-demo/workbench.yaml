apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-workbench
  namespace: rhoai-demo
  labels:
    opendatahub.io/dashboard: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# CPU workbench — do not request the sandbox GPU (gpt-oss-20b already owns it).
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: demo-workbench
  namespace: rhoai-demo
  labels:
    app: demo-workbench
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    notebooks.opendatahub.io/inject-auth: "true"
    notebooks.opendatahub.io/last-image-selection: s2i-generic-data-science-notebook:3.5
    opendatahub.io/image-display-name: Standard Data Science
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/connections: rhoai-demo/pipeline-bucket,rhoai-demo/gpt-oss-20b-endpoint,rhoai-demo/bge-m3-endpoint
    opendatahub.io/mlflow-instance: mlflow
    opendatahub.io/user: admin
    opendatahub.io/username: admin
    openshift.io/display-name: Demo workbench
    openshift.io/description: Jupyter connected to the demo pipeline server, MLflow, and in-cluster models.
spec:
  template:
    spec:
      enableServiceLinks: false
      containers:
        - name: demo-workbench
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
          imagePullPolicy: IfNotPresent
          workingDir: /opt/app-root/src
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/rhoai-demo/demo-workbench
                --ServerApp.quit_button=False
                --ServerApp.disable_check_xsrf=True
            - name: JUPYTER_IMAGE
              value: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
            - name: MLFLOW_TRACKING_URI
              value: https://rh-ai.apps.ocp.7hrxw.sandbox880.opentlc.com/mlflow
          ports:
            - name: notebook-port
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: demo-workbench
              mountPath: /opt/app-root/src
      volumes:
        - name: demo-workbench
          persistentVolumeClaim:
            claimName: demo-workbench
