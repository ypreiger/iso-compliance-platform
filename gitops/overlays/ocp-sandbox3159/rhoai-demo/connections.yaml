# Dashboard connections (Connections tab + AI asset endpoints + pipeline/AutoRAG S3).
apiVersion: v1
kind: Secret
metadata:
  name: gpt-oss-20b-endpoint
  namespace: rhoai-demo
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: uri-v1
    opendatahub.io/connection-type-ref: uri-v1
    openshift.io/display-name: GPT-oss-20b (in-cluster)
    opendatahub.io/description: On-prem GPU LLM used by Gen AI Studio, AutoRAG, and the ISO playground.
stringData:
  URI: https://gpt-oss-20b-kserve-workload-svc.llm.svc.cluster.local:8000/v1
