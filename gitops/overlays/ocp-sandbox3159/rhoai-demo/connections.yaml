apiVersion: v1
kind: Secret
metadata:
  name: pipeline-bucket
  namespace: rhoai-demo
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
    app: minio
  annotations:
    opendatahub.io/connection-type: s3
    opendatahub.io/connection-type-ref: s3
    openshift.io/display-name: Demo object storage
    opendatahub.io/description: MinIO bucket for pipelines, AutoRAG documents, and MLflow artifacts.
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio12345
  AWS_S3_ENDPOINT: http://minio.rhoai-demo.svc.cluster.local:9000
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_BUCKET: rhoai-demo
