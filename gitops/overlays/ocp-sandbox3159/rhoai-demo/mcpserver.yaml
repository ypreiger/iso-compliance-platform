apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp
  namespace: rhoai-demo
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: iso-compliance-platform
data:
  config.toml: |
    port = "8080"
    bind_address = "0.0.0.0"
    stateless = true
    read_only = true
    cluster_provider_strategy = "in-cluster"
---
# Lifecycle-managed MCP server so the MCP Catalog / playground in this project
# has a Ready server. Image is the same Kubernetes MCP already proven in lls-demo.
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: kubernetes
  namespace: rhoai-demo
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: iso-compliance-platform
  annotations:
    openshift.io/display-name: Kubernetes MCP
    opendatahub.io/description: In-cluster Kubernetes/OpenShift MCP server for agent tool calling.
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: quay.io/containers/kubernetes_mcp_server:latest
  config:
    port: 8080
    path: /mcp
    arguments:
      - --config
      - /etc/kubernetes-mcp-server/config.toml
    env:
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    storage:
      - path: /etc/kubernetes-mcp-server
        permissions: ReadOnly
        source:
          type: ConfigMap
          configMap:
            name: kubernetes-mcp
  mcp:
    stateless: true
  runtime:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  extraLabels:
    opendatahub.io/dashboard: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-view
  namespace: rhoai-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes
    namespace: rhoai-demo
