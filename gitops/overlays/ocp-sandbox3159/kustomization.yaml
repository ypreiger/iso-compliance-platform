# Cluster overlay — catalog PostgreSQL, MaaS + OpenAI (playground-compatible).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iso-platform
resources:
  - ../../layers/01-platform-infra
  - ../../layers/02-app-infra-catalog
  - ../../layers/03-application
  - ../../layers/04-rag-population
  - cluster-config.yaml
  - playground-models-config.yaml
  - secrets.yaml

images:
  - name: iso-api-orchestrator
    newName: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-api-orchestrator
    newTag: latest
  - name: iso-web
    newName: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-web
    newTag: latest
