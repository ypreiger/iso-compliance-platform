# Single Argo CD Application — full ISO platform (sandbox overlay).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iso-compliance-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: iso-compliance-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ypreiger/iso-compliance-platform.git
    targetRevision: main
    path: gitops/overlays/ocp-sandbox3159
  destination:
    server: https://kubernetes.default.svc
    namespace: iso-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
