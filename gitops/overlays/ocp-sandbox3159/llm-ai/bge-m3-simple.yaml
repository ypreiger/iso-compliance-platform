---
# BGE-M3 embedding service using sentence-transformers (simple, CPU-optimized)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bge-m3
  namespace: llm
  labels:
    app: bge-m3
    component: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bge-m3
  template:
    metadata:
      labels:
        app: bge-m3
        component: embeddings
    spec:
      containers:
        - name: embedding-server
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              export HOME=/tmp && \
              pip install --no-cache-dir --user sentence-transformers flask prometheus-client && \
              export PYTHONPATH=/tmp/.local/lib/python3.11/site-packages:$PYTHONPATH && \
              python3 /app/server.py
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: app-code
              mountPath: /app
          env:
            - name: MODEL_NAME
              value: "BAAI/bge-m3"
            - name: MODEL_ID
              value: "bge-m3"
            - name: PORT
              value: "8080"
            # Bump to force rollout when ConfigMap server.py changes
            - name: SERVER_CONFIG_VERSION
              value: "maas-metrics-1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: app-code
          configMap:
            name: bge-m3-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bge-m3-server
  namespace: llm
data:
  server.py: |
    #!/usr/bin/env python3
    """OpenAI-compatible embedding server for BGE-M3 (MaaS-routable)."""
    import os
    import time

    from flask import Flask, Response, jsonify, request
    from prometheus_client import CONTENT_TYPE_LATEST, Counter, Histogram, generate_latest
    from sentence_transformers import SentenceTransformer

    app = Flask(__name__)
    model = None

    MODEL_NAME = os.getenv("MODEL_NAME", "BAAI/bge-m3")
    MODEL_ID = os.getenv("MODEL_ID", "bge-m3")

    REQUESTS = Counter(
        "bge_m3_requests_total",
        "Total embedding requests",
        ["endpoint", "status"],
    )
    TOKENS = Counter(
        "bge_m3_tokens_total",
        "Approximate prompt tokens processed",
        ["endpoint"],
    )
    LATENCY = Histogram(
        "bge_m3_request_latency_seconds",
        "Embedding request latency",
        ["endpoint"],
        buckets=(0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60),
    )

    def load_model():
        global model
        print(f"Loading model: {MODEL_NAME} (id={MODEL_ID})")
        model = SentenceTransformer(MODEL_NAME, device="cpu")
        print("Model loaded successfully")

    def _token_estimate(texts):
        return sum(max(1, len(t.split())) for t in texts)

    @app.route("/health", methods=["GET"])
    def health():
        return jsonify({"status": "healthy", "model": MODEL_ID, "model_name": MODEL_NAME})

    @app.route("/metrics", methods=["GET"])
    def metrics():
        return Response(generate_latest(), mimetype=CONTENT_TYPE_LATEST)

    @app.route("/v1/models", methods=["GET"])
    def list_models():
        return jsonify({
            "object": "list",
            "data": [
                {
                    "id": MODEL_ID,
                    "object": "model",
                    "owned_by": "llm",
                }
            ],
        })

    @app.route("/v1/embeddings", methods=["POST"])
    def embeddings():
        started = time.perf_counter()
        status = "ok"
        try:
            data = request.json or {}
            input_texts = data.get("input", [])
            if isinstance(input_texts, str):
                input_texts = [input_texts]
            if not input_texts:
                status = "empty"
                return jsonify({"error": "input is required"}), 400

            vectors = model.encode(input_texts, normalize_embeddings=True)
            prompt_tokens = _token_estimate(input_texts)
            TOKENS.labels(endpoint="embeddings").inc(prompt_tokens)

            response = {
                "object": "list",
                "data": [
                    {
                        "object": "embedding",
                        "embedding": emb.tolist(),
                        "index": idx,
                    }
                    for idx, emb in enumerate(vectors)
                ],
                "model": MODEL_ID,
                "usage": {
                    "prompt_tokens": prompt_tokens,
                    "total_tokens": prompt_tokens,
                },
            }
            return jsonify(response)
        except Exception as exc:
            status = "error"
            return jsonify({"error": str(exc)[:300]}), 500
        finally:
            REQUESTS.labels(endpoint="embeddings", status=status).inc()
            LATENCY.labels(endpoint="embeddings").observe(time.perf_counter() - started)

    if __name__ == "__main__":
        load_model()
        port = int(os.getenv("PORT", 8080))
        app.run(host="0.0.0.0", port=port)
---
apiVersion: v1
kind: Service
metadata:
  name: bge-m3
  namespace: llm
  labels:
    app: bge-m3
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: bge-m3
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bge-m3
  namespace: llm
  labels:
    app: bge-m3
spec:
  to:
    kind: Service
    name: bge-m3
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
