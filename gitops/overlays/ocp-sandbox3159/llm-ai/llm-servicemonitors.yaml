---
# ServiceMonitor for GPT-oss-20b vLLM metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpt-oss-20b-metrics
  namespace: llm
  labels:
    app.kubernetes.io/name: gpt-oss-20b
    app.kubernetes.io/component: llm-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpt-oss-20b
      app.kubernetes.io/part-of: llminferenceservice
  namespaceSelector:
    matchNames:
      - llm
  endpoints:
    - port: https
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
---
