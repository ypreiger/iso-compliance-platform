---
# ServiceMonitor for BGE-M3 embedding service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bge-m3-metrics
  namespace: llm
  labels:
    app.kubernetes.io/name: bge-m3
    app.kubernetes.io/component: llm-monitoring
spec:
  selector:
    matchLabels:
      app: bge-m3
  namespaceSelector:
    matchNames:
      - llm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
