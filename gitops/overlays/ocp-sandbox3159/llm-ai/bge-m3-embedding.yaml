---
# BAAI/bge-m3 multilingual embedding model for ISO compliance RAG
# Supports English + Hebrew with dense, sparse, and multi-vector embeddings
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: bge-m3-embedding
  namespace: llm
  annotations:
    alpha.maas.opendatahub.io/tiers: '["free", "premium", "enterprise"]'
    openshift.io/display-name: BGE-M3 Multilingual Embeddings (EN/HE)
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: bge-m3
    # Using BAAI/bge-m3 from HuggingFace
    # Note: LLMInferenceService will download from HF Hub automatically
    uri: hf://BAAI/bge-m3
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
  template:
    containers:
      - name: main
        # Using HuggingFace TEI (Text Embeddings Inference) for CPU-based embeddings
        # TEI is optimized for embedding models and has better CPU performance than vLLM
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
        args:
          - --model-id=BAAI/bge-m3
          - --port=8000
          # TEI automatically serves on OpenAI-compatible /v1/embeddings endpoint
        env:
          - name: HF_HUB_ENABLE_HF_TRANSFER
            value: "1"
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 12Gi
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
