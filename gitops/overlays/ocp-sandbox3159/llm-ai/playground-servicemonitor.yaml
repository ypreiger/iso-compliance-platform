apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: playground-observability
  namespace: llm
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: playground-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: playground
  namespaceSelector:
    matchNames:
      - iso-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
