---
# Application model-call metrics (iso-api + docgen) — complements MaaS authorized_hits.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  # Renamed CR: instanceSelector is immutable on GrafanaDashboard.
  name: iso-app-model-calls
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: iso-compliance-platform
    app.kubernetes.io/component: observability
spec:
  # Must match Grafana CR labels (same as maas-token-metrics)
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  json: |
    {
      "uid": "iso-app-model-metrics",
      "title": "ISO App Model Calls (every invocation)",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "tags": ["iso", "llm", "bge-m3", "observability"],
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
            "query": "label_values(iso_app_model_requests_total, service)",
            "includeAll": true,
            "multi": true,
            "current": {"text": "All", "value": "$__all"}
          },
          {
            "name": "model",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
            "query": "label_values(iso_app_model_requests_total, model)",
            "includeAll": true,
            "multi": true,
            "current": {"text": "All", "value": "$__all"}
          },
          {
            "name": "task",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
            "query": "label_values(iso_app_model_requests_total, task)",
            "includeAll": true,
            "multi": true,
            "current": {"text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Model requests / s by model",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
          "targets": [
            {
              "expr": "sum by (model) (rate(iso_app_model_requests_total{model=~\"$model\",task=~\"$task\"}[$__rate_interval]))",
              "legendFormat": "{{model}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Tokens / s by model (total)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
          "targets": [
            {
              "expr": "sum by (model) (rate(iso_app_model_tokens_total{model=~\"$model\",task=~\"$task\",token_type=\"total\"}[$__rate_interval]))",
              "legendFormat": "{{model}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Requests / s by task",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
          "targets": [
            {
              "expr": "sum by (task) (rate(iso_app_model_requests_total{model=~\"$model\",task=~\"$task\"}[$__rate_interval]))",
              "legendFormat": "{{task}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "P95 latency by model",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, model) (rate(iso_app_model_latency_seconds_bucket{model=~\"$model\",task=~\"$task\"}[$__rate_interval])))",
              "legendFormat": "{{model}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Calls in range by service × task × model × status",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "5b4d84cc-548e-4c40-b6b1-fe98a25ede58"},
          "targets": [
            {
              "expr": "sum by (service, task, model, status) (increase(iso_app_model_requests_total{model=~\"$model\",task=~\"$task\"}[$__range]))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {"id": "labelsToFields", "options": {}},
            {"id": "organize", "options": {"excludeByName": {"Time": true}}}
          ]
        }
      ]
    }
