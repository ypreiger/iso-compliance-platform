              "expr": "histogram_quantile(0.95, rate(vllm:e2e_request_latency_seconds_bucket{job=~\"gpt-oss-20b.*|qwen3.*\"}[5m])) * 1000",
              "legendFormat": "{{job}} - P95",
              "refId": "A"
