---
# OpenAI GPT-oss-20b: Open-weight model with reasoning capabilities
# 21B params (3.6B active via MoE), Apache 2.0 license
# Matches o3-mini performance, 128K context, structured outputs
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: gpt-oss-20b
  namespace: llm
  annotations:
    alpha.maas.opendatahub.io/tiers: '["free", "premium", "enterprise"]'
    openshift.io/display-name: "OpenAI GPT-oss-20b (Reasoning)"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: gpt-oss-20b
    # Using HuggingFace model path
    uri: hf://openai/gpt-oss-20b
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
  template:
    containers:
      - name: main
        image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.5
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --served-model-name={{.Name}}
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          # GPT-oss optimizations
          - --trust-remote-code
          - --max-model-len=131072
          # Use FP8 for better performance on L40S
          - --quantization=fp8
          - --gpu-memory-utilization=0.90
          # Enable structured outputs and function calling
          - --enable-auto-tool-choice
          - --tool-call-parser=hermes
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 180
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 10
        resources:
          requests:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "6"
            memory: 40Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: l40-gpu
        effect: NoSchedule
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
