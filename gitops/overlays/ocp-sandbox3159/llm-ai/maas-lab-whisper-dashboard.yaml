apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: maas-lab-whisper
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: iso-compliance-platform
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  json: |-
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.3.0",
          "targets": [
            {
              "expr": "sum(authorized_hits{user=~\"$user\",model=~\"$model\",model!=\"\"})",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Total Authorized Hits",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 16,
            "x": 8,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "11.3.0",
          "targets": [
            {
              "expr": "sum by (model) (rate(authorized_hits{user=~\"$user\",model=~\"$model\",model!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{model}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Authorized Hits Rate by Model",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "11.3.0",
          "targets": [
            {
              "expr": "sum by (model_id, provider) (rate(playground_stt_transcriptions_total{status=\"success\",model_id=~\"$model\"}[$__rate_interval]))",
              "legendFormat": "{{model_id}} ({{provider}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Whisper STT Success Rate by Model",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "11.3.0",
          "targets": [
            {
              "expr": "sum by (model_id, provider) (rate(playground_stt_transcriptions_total{status=\"error\",model_id=~\"$model\"}[$__rate_interval]))",
              "legendFormat": "{{model_id}} ({{provider}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Whisper STT Error Rate by Model",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "11.3.0",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, model_id, provider) (rate(playground_stt_transcription_latency_seconds_bucket{model_id=~\"$model\"}[$__rate_interval])))",
              "legendFormat": "{{model_id}} ({{provider}})",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Whisper STT p95 Latency",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 6,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": true
            },
            "showHeader": true
          },
          "pluginVersion": "11.3.0",
          "targets": [
            {
              "expr": "sum by (model_id, provider, status) (playground_stt_transcriptions_total{model_id=~\"$model\"})",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "sum by (model_id, provider) (playground_stt_audio_seconds_total{model_id=~\"$model\"})",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "title": "Whisper STT Totals",
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 40,
      "tags": [
        "llm",
        "kuadrant",
        "tokens",
        "whisper",
        "stt"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(authorized_hits, user)",
            "hide": 0,
            "includeAll": true,
            "label": "User",
            "multi": true,
            "name": "user",
            "options": [],
            "query": {
              "query": "label_values(authorized_hits, user)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query",
            "allValue": ".*"
          },
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "query_result(sum by (model) (authorized_hits{model!=\"\"}) or sum by (model) (label_replace(playground_stt_transcriptions_total{model_id!=\"\"}, \"model\", \"$1\", \"model_id\", \"(.*)\")))",
            "hide": 0,
            "includeAll": true,
            "label": "Model",
            "multi": true,
            "name": "model",
            "options": [],
            "query": {
              "query": "query_result(sum by (model) (authorized_hits{model!=\"\"}) or sum by (model) (label_replace(playground_stt_transcriptions_total{model_id!=\"\"}, \"model\", \"$1\", \"model_id\", \"(.*)\")))",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "model=\"([^\"]+)\"",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query",
            "allValue": ".*"
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "MaaS Token Metrics Dashboard (with User/Model Filters + Whisper STT)",
      "uid": "maas-lab-whisper",
      "version": 1,
      "weekStart": ""
    }
