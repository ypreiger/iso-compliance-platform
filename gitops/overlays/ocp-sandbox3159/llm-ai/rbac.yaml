---
# RBAC: Allow the playground SA in iso-platform to call MaaS models
# MaaS uses OpenShift token auth (Bearer <SA token>)
# system:authenticated includes all valid SA tokens → free tier access
# This ClusterRoleBinding adds the playground SA to tier-free-users group
# so TrustyAI can also correlate inference requests by user.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-client
  namespace: iso-platform
  labels:
    app.kubernetes.io/part-of: iso-compliance
    app.kubernetes.io/component: playground
---
# ClusterRole: allow LLMInferenceService access for MaaS Kuadrant AuthPolicy
#
# The MaaS gateway-auth-policy runs a SubjectAccessReview on every request:
#   verb: "post"  resource: "llminferenceservices"  group: "serving.kserve.io"
#   namespace: extracted from request path (/llm/qwen3-4b-instruct/...)
#   user: SA username (system:serviceaccount:iso-platform:default)
#
# "post" and "use" are non-standard RBAC verbs — they are accepted by the
# Kubernetes API server and checked via SubjectAccessReview even though
# kubectl auth can-i doesn't show them as "known verbs".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iso-maas-llm-access
  labels:
    app.kubernetes.io/part-of: iso-compliance
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["get", "list", "post", "create", "use"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "post", "use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iso-platform-llm-access
  labels:
    app.kubernetes.io/part-of: iso-compliance
subjects:
  - kind: ServiceAccount
    name: default
    namespace: iso-platform
  - kind: ServiceAccount
    name: maas-client
    namespace: iso-platform
  - kind: ServiceAccount
    name: iso-platform
    namespace: iso-platform
roleRef:
  kind: ClusterRole
  name: iso-maas-llm-access
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iso-platform-llm-access-all
  labels:
    app.kubernetes.io/part-of: iso-compliance
subjects:
  - kind: ServiceAccount
    name: default
    namespace: iso-platform
  - kind: ServiceAccount
    name: maas-client
    namespace: iso-platform
  - kind: ServiceAccount
    name: iso-platform
    namespace: iso-platform
roleRef:
  kind: ClusterRole
  name: iso-maas-llm-access
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole: allow POST access on all MaaS model routes.
# MaaS gateway performs SubjectAccessReview with verb=post on llminferenceservices.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iso-maas-llm-post-all
  labels:
    app.kubernetes.io/part-of: iso-compliance
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["post"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iso-platform-llm-post-all
  labels:
    app.kubernetes.io/part-of: iso-compliance
subjects:
  - kind: ServiceAccount
    name: default
    namespace: iso-platform
  - kind: ServiceAccount
    name: maas-client
    namespace: iso-platform
  - kind: ServiceAccount
    name: iso-platform
    namespace: iso-platform
roleRef:
  kind: ClusterRole
  name: iso-maas-llm-post-all
  apiGroup: rbac.authorization.k8s.io

---
# OpenShift Group: iso-platform service accounts get enterprise MaaS tier
# Enterprise tier = 50 requests per 2 minutes (vs 5 for free tier)
# This ensures the playground is never rate-limited during demos.
# The admin-group is referenced in tier-to-group-mapping as enterprise tier.
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: admin-group
  labels:
    app.kubernetes.io/part-of: iso-compliance
users: []
---
# RHOAI dashboard visibility:
# - system:authenticated can view llm and iso-platform projects/assets
# - rhods-admins has admin rights for project management in dashboard
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view
  namespace: llm
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin
  namespace: llm
subjects:
  - kind: Group
    name: rhods-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view
  namespace: iso-platform
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin
  namespace: iso-platform
subjects:
  - kind: Group
    name: rhods-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
