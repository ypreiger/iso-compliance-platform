---
# MaaS model route aliases.
# These create additional MaaS endpoints so usage can be tracked per model route
# in Kuadrant/Prometheus while keeping the same model artifact.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-4b-instruct-2
  namespace: llm
  annotations:
    alpha.maas.opendatahub.io/tiers: '["free", "premium", "enterprise"]'
    openshift.io/display-name: Qwen3 4B Instruct 2507 (Alias 2)
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: qwen3-4b-instruct-2
    uri: oci://quay.io/jharmison/models:qwen--qwen3-4b-instruct-2507-modelcar
  replicas: 0
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
  template:
    containers:
      - name: main
        image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.5
        command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - --served-model-name={{.Name}}
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-auto-tool-choice
          - --tool-call-parser=hermes
          - --gpu-memory-utilization=0.95
          - --max-model-len=131072
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "6"
            memory: 48Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: l40-gpu
        effect: NoSchedule
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi

