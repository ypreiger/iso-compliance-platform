---
apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-small-app
  namespace: llm
  labels:
    app.kubernetes.io/name: whisper-small
    app.kubernetes.io/part-of: llm-platform
data:
  app.py: |
    from __future__ import annotations

    import os
    import tempfile
    from pathlib import Path
    from threading import Lock

    from flask import Flask, jsonify, request
    from faster_whisper import WhisperModel

    app = Flask(__name__)

    MODEL_NAME = os.getenv("WHISPER_MODEL_NAME", "small")
    MODEL_DEVICE = os.getenv("WHISPER_MODEL_DEVICE", "cpu")
    MODEL_COMPUTE_TYPE = os.getenv("WHISPER_MODEL_COMPUTE_TYPE", "int8")
    MAX_AUDIO_MB = int(os.getenv("WHISPER_MAX_AUDIO_MB", "25"))
    VAD_FILTER = os.getenv("WHISPER_VAD_FILTER", "true").strip().lower() not in ("0", "false", "no")

    _model: WhisperModel | None = None
    _lock = Lock()


    def _get_model() -> WhisperModel:
      global _model
      if _model is not None:
        return _model
      with _lock:
        if _model is None:
          _model = WhisperModel(MODEL_NAME, device=MODEL_DEVICE, compute_type=MODEL_COMPUTE_TYPE)
      return _model


    @app.get("/health")
    def health():
      return jsonify(
        {
          "status": "healthy",
          "service": "whisper-small",
          "model_name": MODEL_NAME,
          "model_device": MODEL_DEVICE,
          "model_compute_type": MODEL_COMPUTE_TYPE,
          "model_loaded": _model is not None,
        }
      )


    @app.get("/v1/models")
    def models():
      return jsonify(
        {
          "object": "list",
          "data": [
            {
              "id": "whisper-small",
              "object": "model",
              "owned_by": "llm",
            }
          ],
        }
      )


    @app.post("/v1/audio/transcriptions")
    def transcriptions():
      upload = request.files.get("file") or request.files.get("audio")
      if upload is None or not upload.filename:
        return jsonify({"error": {"message": "missing multipart file field 'file'"}}), 400

      data = upload.read()
      if not data:
        return jsonify({"error": {"message": "audio file is empty"}}), 400
      if len(data) > MAX_AUDIO_MB * 1024 * 1024:
        return jsonify({"error": {"message": f"audio exceeds max size {MAX_AUDIO_MB} MB"}}), 413

      language = (request.form.get("language") or "").strip() or None
      suffix = Path(upload.filename).suffix or ".wav"
      tmp_name = ""
      try:
        with tempfile.NamedTemporaryFile(prefix="whisper-small-", suffix=suffix, delete=False) as tmp:
          tmp.write(data)
          tmp_name = tmp.name

        model = _get_model()
        segments, info = model.transcribe(tmp_name, language=language, vad_filter=VAD_FILTER)
        transcript = " ".join(seg.text.strip() for seg in segments if seg.text and seg.text.strip())
        if not transcript:
          return jsonify({"error": {"message": "no text detected in audio"}}), 422
        return jsonify(
          {
            "text": transcript,
            "language": getattr(info, "language", language or "unknown"),
            "duration": getattr(info, "duration", None),
            "model": "whisper-small",
          }
        )
      except Exception as exc:
        return jsonify({"error": {"message": f"whisper transcription failed: {str(exc)[:220]}"}}), 500
      finally:
        if tmp_name:
          try:
            os.unlink(tmp_name)
          except OSError:
            pass


    if __name__ == "__main__":
      app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-small
  namespace: llm
  labels:
    app.kubernetes.io/name: whisper-small
    app.kubernetes.io/part-of: llm-platform
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whisper-small
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whisper-small
        app.kubernetes.io/part-of: llm-platform
    spec:
      containers:
        - name: whisper
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["sh", "-c", "pip install flask faster-whisper --quiet && python /app/app.py"]
          env:
            - name: WHISPER_MODEL_NAME
              value: "small"
            - name: WHISPER_MODEL_DEVICE
              value: "cpu"
            - name: WHISPER_MODEL_COMPUTE_TYPE
              value: "int8"
            - name: WHISPER_MAX_AUDIO_MB
              value: "100"
            - name: WHISPER_VAD_FILTER
              value: "true"
            - name: HF_HOME
              value: /cache/hf
            - name: XDG_CACHE_HOME
              value: /cache
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: cache
              mountPath: /cache
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app
          configMap:
            name: whisper-small-app
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-small
  namespace: llm
  labels:
    app.kubernetes.io/name: whisper-small
    app.kubernetes.io/part-of: llm-platform
spec:
  selector:
    app.kubernetes.io/name: whisper-small
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whisper-small-maas-route
  namespace: llm
  labels:
    app.kubernetes.io/name: whisper-small
    app.kubernetes.io/component: model-routing
    app.kubernetes.io/part-of: llm-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-default-gateway
      namespace: openshift-ingress
  rules:
    - backendRefs:
        - kind: Service
          name: whisper-small
          port: 8080
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      matches:
        - path:
            type: PathPrefix
            value: /llm/whisper-small/v1
