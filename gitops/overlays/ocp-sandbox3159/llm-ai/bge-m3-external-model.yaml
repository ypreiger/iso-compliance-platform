---
# Register BGE-M3 as ExternalModel in RHOAI MaaS
# Enables observability, guardrails, and UI visibility
apiVersion: serving.kserve.io/v1alpha1
kind: ExternalModel
metadata:
  name: bge-m3-embed
  namespace: llm
  annotations:
    alpha.maas.opendatahub.io/tiers: '["free", "premium", "enterprise"]'
    openshift.io/display-name: "BGE-M3 Multilingual Embeddings (External)"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  # Point to our existing bge-m3 service
  url: http://bge-m3.llm.svc.cluster.local:8080

  # Model metadata for MaaS
  model:
    name: bge-m3-embed
    # OpenAI-compatible embeddings endpoint
    format: openai
    version: "1.0"

  # Route through MaaS gateway
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}

  # Health check configuration
  health:
    path: /health
    port: 8080
