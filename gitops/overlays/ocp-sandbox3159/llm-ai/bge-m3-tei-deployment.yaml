---
# BGE-M3 embedding service using HuggingFace TEI (Text Embeddings Inference)
# Deployed as standard Deployment (not LLMInferenceService) for TEI compatibility
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bge-m3-tei
  namespace: llm
  labels:
    app: bge-m3-tei
    component: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bge-m3-tei
  template:
    metadata:
      labels:
        app: bge-m3-tei
        component: embeddings
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
          args:
            - "--model-id"
            - "BAAI/bge-m3"
            - "--port"
            - "8080"
            - "--max-batch-tokens"
            - "16384"
            - "--json-output"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: MODEL_ID
              value: "BAAI/bge-m3"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bge-m3-tei
  namespace: llm
  labels:
    app: bge-m3-tei
    component: embeddings
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: bge-m3-tei
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bge-m3-tei
  namespace: llm
  labels:
    app: bge-m3-tei
    component: embeddings
spec:
  to:
    kind: Service
    name: bge-m3-tei
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
