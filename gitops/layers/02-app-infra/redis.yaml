apiVersion: apps/v1
kind: Deployment
metadata:
  name: iso-redis
  labels:
    app.kubernetes.io/name: iso-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iso-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-redis
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iso-redis
  labels:
    app.kubernetes.io/name: iso-redis
spec:
  selector:
    app.kubernetes.io/name: iso-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
