apiVersion: v1
kind: ServiceAccount
metadata:
  name: iso-platform
  labels:
    app.kubernetes.io/component: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iso-platform-job-runner
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iso-platform-job-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iso-platform-job-runner
subjects:
  - kind: ServiceAccount
    name: iso-platform
    namespace: iso-platform
