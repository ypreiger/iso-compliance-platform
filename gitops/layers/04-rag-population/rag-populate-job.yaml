apiVersion: batch/v1
kind: Job
metadata:
  name: iso-rag-populate
  labels:
    app.kubernetes.io/name: iso-rag-populate
    app.kubernetes.io/component: rag
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-rag-populate
    spec:
      serviceAccountName: iso-platform
      restartPolicy: OnFailure
      containers:
        - name: rag-ingest
          image: image-registry.openshift-image-registry.svc:5000/iso-platform/rag-iso:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: iso-app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: DATABASE_PASSWORD
            - name: MAAS_BEARER_TOKEN_FILE
              value: /var/run/secrets/maas/token
            - name: RAG_ROOT
              value: /opt/rag
          volumeMounts:
            - name: rag-store
              mountPath: /data/rag
            - name: maas-token
              mountPath: /var/run/secrets/maas
              readOnly: true
      volumes:
        - name: rag-store
          persistentVolumeClaim:
            claimName: iso-rag-data
        - name: maas-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: maas-default-gateway-sa
                  expirationSeconds: 3600
                  path: token
