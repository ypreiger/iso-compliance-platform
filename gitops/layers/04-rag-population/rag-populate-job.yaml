apiVersion: batch/v1
kind: Job
metadata:
  name: iso-rag-populate
  labels:
    app.kubernetes.io/name: iso-rag-populate
    app.kubernetes.io/component: rag
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-rag-populate
    spec:
      serviceAccountName: iso-platform
      restartPolicy: OnFailure
      initContainers:
        - name: git-clone
          image: registry.redhat.io/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -ec
            - |
              microdnf install -y git git-lfs && git lfs install
              REPO="${GIT_REPO_URL}"
              if [ -n "${GIT_USERNAME:-}" ] && [ -n "${GIT_PASSWORD:-}" ]; then
                REPO="https://${GIT_USERNAME}:${GIT_PASSWORD}@${GIT_REPO_URL#https://}"
              fi
              git clone --depth 1 --branch "${GIT_REPO_REVISION}" "${REPO}" /seed
              cd /seed && git lfs pull
              test -f /seed/RAG/manifest.yaml
          envFrom:
            - configMapRef:
                name: iso-app-config
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: GIT_USERNAME
                  optional: true
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: GIT_PASSWORD
                  optional: true
          volumeMounts:
            - name: rag-data
              mountPath: /seed
      containers:
        - name: rag-ingest
          image: image-registry.openshift-image-registry.svc:5000/iso-platform/rag-iso:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: iso-app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: DATABASE_PASSWORD
            - name: RAG_ROOT
              value: /seed/RAG
          volumeMounts:
            - name: rag-data
              mountPath: /seed
              readOnly: true
            - name: rag-store
              mountPath: /data/rag
      volumes:
        - name: rag-data
          emptyDir: {}
        - name: rag-store
          persistentVolumeClaim:
            claimName: iso-rag-data
