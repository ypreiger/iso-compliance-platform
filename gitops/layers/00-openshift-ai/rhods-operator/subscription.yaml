# Red Hat OpenShift AI operator — track latest 3.x GA (currently 3.5.0).
# Channel stable-3.x is the catalog default and receives subsequent 3.x GA z-streams.
# Do not use beta/alpha (Early Access). EA→GA has no OLM replaces graph; changing
# channel then deleting the EA ClusterServiceVersion is the supported sandbox cutover.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
  labels:
    app.kubernetes.io/part-of: iso-compliance-platform
    app.kubernetes.io/component: openshift-ai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  channel: stable-3.x
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
