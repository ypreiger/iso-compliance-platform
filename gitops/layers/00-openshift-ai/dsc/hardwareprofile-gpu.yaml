# GPU hardware profile for the sandbox L40S worker. Visible in Deploy model /
# workbench wizards. Workloads that opt in get the GPU taint toleration.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: nvidia-l40s
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/display-name: NVIDIA L40S (1 GPU)
    opendatahub.io/description: Single NVIDIA L40S on the GPU worker. Only one GPU exists on this sandbox — gpt-oss-20b already uses it.
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: "[]"
    argocd.argoproj.io/sync-wave: "12"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  identifiers:
    - displayName: CPU
      identifier: cpu
      resourceType: CPU
      minCount: 1
      maxCount: 8
      defaultCount: 2
    - displayName: Memory
      identifier: memory
      resourceType: Memory
      minCount: 4Gi
      maxCount: 64Gi
      defaultCount: 8Gi
    - displayName: NVIDIA GPU
      identifier: nvidia.com/gpu
      resourceType: Accelerator
      minCount: 0
      maxCount: 1
      defaultCount: 1
  scheduling:
    type: Node
    node:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: l40-gpu
          effect: NoSchedule
