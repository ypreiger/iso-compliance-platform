apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iso-platform
resources:
  - iso-api.yaml
  - iso-web.yaml
  - iso-docgen.yaml
  - playground.yaml
  - playground-servicemonitor.yaml
  - maas-openai-proxy.yaml

images:
  - name: iso-api-orchestrator
    newName: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-api-orchestrator
    newTag: latest
  - name: iso-web
    newName: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-web
    newTag: latest
  - name: iso-docgen
    newName: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-docgen
    newTag: latest
