apiVersion: apps/v1
kind: Deployment
metadata:
  name: iso-api
  labels:
    app.kubernetes.io/name: iso-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iso-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-api
    spec:
      serviceAccountName: iso-platform
      containers:
        - name: iso-api
          image: iso-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: iso-app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: DATABASE_PASSWORD
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: LLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iso-api
  labels:
    app.kubernetes.io/name: iso-api
spec:
  selector:
    app.kubernetes.io/name: iso-api
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: iso-api
  labels:
    app.kubernetes.io/name: iso-api
spec:
  to:
    kind: Service
    name: iso-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
