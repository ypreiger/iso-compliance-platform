apiVersion: apps/v1
kind: Deployment
metadata:
  name: iso-api
  labels:
    app.kubernetes.io/name: iso-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iso-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-api
    spec:
      serviceAccountName: iso-platform
      containers:
        - name: iso-api
          image: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: iso-app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: DATABASE_PASSWORD
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: LLM_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: SAML_IDP_ENTITY_ID
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: SAML_IDP_ENTITY_ID
                  optional: true
            - name: SAML_IDP_SSO_URL
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: SAML_IDP_SSO_URL
                  optional: true
            - name: SAML_SP_ENTITY_ID
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: SAML_SP_ENTITY_ID
                  optional: true
            - name: SAML_SP_ACS_URL
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: SAML_SP_ACS_URL
                  optional: true
            - name: SAML_IDP_X509_CERT
              valueFrom:
                secretKeyRef:
                  name: iso-secrets
                  key: SAML_IDP_X509_CERT
                  optional: true
            - name: AUTH_DEV_MODE
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: AUTH_DEV_MODE
            - name: ADMIN_EMAILS
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: ADMIN_EMAILS
            - name: ISO_WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: ISO_WEB_URL
            - name: DOCGEN_URL
              valueFrom:
                configMapKeyRef:
                  name: iso-app-config
                  key: DOCGEN_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iso-api
  labels:
    app.kubernetes.io/name: iso-api
spec:
  selector:
    app.kubernetes.io/name: iso-api
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: iso-api
  labels:
    app.kubernetes.io/name: iso-api
  annotations:
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/max-body-size: 100m
spec:
  to:
    kind: Service
    name: iso-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
