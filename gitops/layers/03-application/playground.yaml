    <body>
    <div class="wrap">
    <!-- main chat -->
    <div class="main-card">
      <div class="hdr">
        <div style="flex:1">
          <h1>🤖 {{ title }}</h1>
          <p>{{ subtitle }}</p>
        </div>
        <a class="rhoai-btn" href="{{ rhoai_url }}" target="_blank">📊 RHOAI Dashboard</a>
      </div>
      <div class="info-bar">
        <div class="info-pill"><div class="dot dot-green" id="modelDot"></div><span id="modelStatus">Select a model</span></div>
        <div class="info-pill"><div class="dot" id="guardrailsDot" style="background:#28a745"></div><span>Guardrails: <span id="guardrailsLabel">active</span></span></div>
        <div class="info-pill"><div class="dot" id="trustyaiDot" style="background:#ffc107"></div><span>TrustyAI: <span id="trustyaiLabel">checking…</span></span></div>
        <div class="info-pill" id="contextPill" style="display:none"><span id="contextLabel"></span></div>
      </div>
      <div class="body">
        <div class="tab-row">
          <button class="tab-btn active" id="tabChat" onclick="showTab('chat')">💬 Chat</button>
          <button class="tab-btn" id="tabSpeech" onclick="showTab('speech')">🎤 Speech to Text</button>
          <button class="tab-btn" id="tabFile" onclick="showTab('file')">📎 File Prompt</button>
        </div>
        <div class="guard-banner">
          <span class="icon">🛡️</span>
          <span><strong>Guardrails active</strong> — request flow enforced by MaaS auth + optional topic policy.
          TrustyAI/monitoring endpoints provide per-model observability.
          <a href="{{ rhoai_url }}/projects/llm" target="_blank" style="color:#0c5460;font-weight:600">View in RHOAI →</a></span>
        </div>
        <div class="model-row">
          <label for="modelSel">Model:</label>
          <select id="modelSel" onchange="onModel()">
            {% for m in models %}
            <option value="{{ m.id }}" data-provider="{{ m.provider }}" data-note="{{ m.get('note','') }}" {% if m.get('_disabled') %}disabled{% endif %}>
              {% if m.get('_disabled') %}[unavailable] {% endif %}{{ m.label }}
            </option>
            {% endfor %}
          </select>
          <span id="providerBadge" class="badge badge-rhoai"></span>
        </div>
        <div class="model-note" id="modelNote"></div>
        <div class="model-row">
          <label for="guardrailMode">Guardrails:</label>
          <select id="guardrailMode" onchange="onGuardrailModeChange()">
            <option value="iso_only">ISO/Red Hat only</option>
            <option value="cv_analysis">Analyze CV</option>
            <option value="speech_any_subject">Speech/Text analyzer (any subject)</option>
          </select>
          <span id="guardrailModeBadge" class="badge badge-rhoai">iso_only</span>
        </div>
        <div class="model-note" id="guardrailModeNote"></div>

        <div id="chatPane" class="pane active">
          <textarea id="prompt" placeholder="Enter a prompt… (Ctrl+Enter to send)">What is Red Hat OpenShift AI and how does it support ISO 27001 compliance?</textarea>
          <div class="btn-row">
            <button class="btn-send" id="sendBtn" onclick="send()">Send</button>
            <button class="btn-clear" onclick="clearChat()">Clear</button>
          </div>
          <div class="resp" id="resp">Response will appear here…</div>
          <div class="meta" id="meta"></div>
        </div>

        <div id="speechPane" class="pane">
          <div class="speech-help">
            Whisper-style speech-to-text runs in-cluster on a dedicated STT pod. Supports English, Hebrew, and Arabic for mic and audio-file transcription.
          </div>
          <div class="speech-row">
            <button class="btn-send" id="speechStartBtn" onclick="startSpeech()">Start Listening</button>
            <button class="btn-clear" id="speechStopBtn" onclick="stopSpeech()">Stop</button>
            <input type="file" id="speechFile" accept="audio/*" />
            <select id="speechSttModel" style="min-width:210px;padding:8px;border:1px solid #dee2e6;border-radius:8px"></select>
            <select id="speechLang" style="min-width:150px;padding:8px;border:1px solid #dee2e6;border-radius:8px">
              <option value="auto">Auto Detect</option>
              <option value="en">English</option>
              <option value="he">Hebrew</option>
              <option value="ar">Arabic</option>
            </select>
            <button class="btn-send" id="speechTranscribeBtn" onclick="transcribeSpeech()">Transcribe (in-cluster)</button>
            <span class="speech-status" id="speechStatus">Idle</span>
          </div>
          <textarea id="speechTranscript" placeholder="Transcript appears here..."></textarea>
          <textarea id="speechSummaryPrompt" placeholder="How should the transcript be summarized?">{{ speech_summary_prompt }}</textarea>
          <div class="btn-row">
            <button class="btn-send" id="speechSummarizeBtn" onclick="summarizeSpeech()">Summarize Transcript</button>
            <button class="btn-clear" onclick="clearSpeech()">Clear</button>
          </div>
          <div class="resp" id="speechResp">Speech summary will appear here…</div>
          <div class="meta" id="speechMeta"></div>
        </div>

        <div id="filePane" class="pane">
          <div class="file-help">
            Upload a file and run a dedicated system prompt + your criteria against its content in the same playground (English, Hebrew, Arabic supported).
          </div>
          <div class="speech-row">
            <input type="file" id="analysisFile" />
            <select id="analysisLang" style="min-width:150px;padding:8px;border:1px solid #dee2e6;border-radius:8px">
              <option value="he">Hebrew</option>
              <option value="en">English</option>
              <option value="ar">Arabic</option>
            </select>
          </div>
          <textarea id="analysisSystemPrompt" placeholder="System prompt for file analysis">{{ file_analysis_system_prompt }}</textarea>
          <textarea id="analysisCriteria" placeholder="Describe your matching criteria (what to look for)."></textarea>
          <div class="btn-row">
            <button class="btn-send" id="analyzeFileBtn" onclick="analyzeFile()">Analyze Uploaded File</button>
            <button class="btn-clear" onclick="clearFileAnalysis()">Clear</button>
          </div>
          <div class="resp" id="fileResp">File analysis result will appear here…</div>
          <div class="meta" id="fileMeta"></div>
        </div>
      </div>
    </div>
    <!-- sidebar -->
    <div class="side-card">
      <div class="hdr">
        <div>
          <h1>⚡ AI Status</h1>
          <p>RHOAI · TrustyAI · MaaS</p>
        </div>
      </div>
      <!-- TrustyAI -->
      <div class="side-section">
        <h3>TrustyAI</h3>
        <div class="stat-row"><span>Service</span><span id="tai-svc" class="status-badge status-partial">checking…</span></div>
        <div class="stat-row"><span>Liveness</span><span id="tai-live" class="status-badge status-partial">…</span></div>
        <div class="stat-row"><span>Data store</span><span id="tai-data" class="status-badge status-partial">…</span></div>
        <div class="stat-row"><span>Guardrails orch</span><span id="tai-guard" class="status-badge status-partial">…</span></div>
        <div class="stat-row"><span>STT service</span><span id="stt-svc" class="status-badge status-partial">checking…</span></div>
        <div style="margin-top:10px">
          <a href="{{ rhoai_url }}/projects/llm" target="_blank" style="font-size:12px;color:#0d6efd">→ View in RHOAI Dashboard</a>
        </div>
      </div>
      <!-- MaaS models -->
      <div class="side-section">
        <h3>Available Models</h3>
        {% for m in models %}
        <div class="model-chip">
          <span class="chip-badge badge {{ 'badge-rhoai' if m.provider=='rhoai' else 'badge-openai' if m.provider=='openai' else 'badge-custom' }}">
            {{ m.provider }}
          </span>
          <div class="chip-label">{{ m.id }}</div>
          {% if m.get('note') %}<div class="chip-note">{{ m.note }}</div>{% endif %}
          {% if m.get('_disabled') %}<div class="chip-note" style="color:#e53935">⚠ {{ m.get('_disabled_reason','unavailable') }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <!-- links -->
      <div class="side-section">
        <h3>Quick Links</h3>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:13px">
          <a href="{{ rhoai_url }}" target="_blank">📊 RHOAI Dashboard</a>
          <a href="{{ rhoai_url }}/projects/llm" target="_blank">🗂 Project: llm</a>
          <a href="{{ rhoai_url }}/modelServing/llm" target="_blank">🤖 Model Serving</a>
          <a href="https://iso-web-iso-platform.apps.ocp.8mkwb.sandbox3159.opentlc.com" target="_blank">📋 ISO Viewer</a>
        </div>
      </div>
    </div>
    </div>
    <script>
    const MODELS = {{ models_json | safe }};
    const DEFAULT_MODEL_ID = {{ default_model_id | tojson }};
    const GUARDRAIL_DEFAULT_MODE = {{ guardrail_default_mode | tojson }};
    const STT_DEFAULT_MODEL_ID = {{ stt_default_model_id | tojson }};
    const SPEECH_RECOGNITION_LANG = {{ speech_recognition_lang | tojson }};
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    const SPEECH_LANG_MAP = { en: 'en-US', he: 'he-IL', ar: 'ar-SA' };
    let STT_MODELS = [];
    let speechRecognizer = null;
    let speechTranscriptFinal = '';

    function showTab(tab){
      const chatPane = document.getElementById('chatPane');
      const speechPane = document.getElementById('speechPane');
      const filePane = document.getElementById('filePane');
      const tabChat = document.getElementById('tabChat');
      const tabSpeech = document.getElementById('tabSpeech');
      const tabFile = document.getElementById('tabFile');
      const onChat = tab === 'chat';
      const onSpeech = tab === 'speech';
      const onFile = tab === 'file';
      chatPane.className = 'pane' + (onChat ? ' active' : '');
      speechPane.className = 'pane' + (onSpeech ? ' active' : '');
      filePane.className = 'pane' + (onFile ? ' active' : '');
      tabChat.className = 'tab-btn' + (onChat ? ' active' : '');
      tabSpeech.className = 'tab-btn' + (onSpeech ? ' active' : '');
      tabFile.className = 'tab-btn' + (onFile ? ' active' : '');
    }

    function setSpeechStatus(text){
      document.getElementById('speechStatus').textContent = text;
    }

    function selectedSttModelId(){
      return (document.getElementById('speechSttModel').value || STT_DEFAULT_MODEL_ID || 'local-whisper').trim();
    }

    async function loadSttModels(){
      const sel = document.getElementById('speechSttModel');
      sel.innerHTML = '';
      try{
        const res = await fetch('/speech/models');
        const d = await res.json();
        STT_MODELS = Array.isArray(d.models) ? d.models : [];
      }catch(_e){
        STT_MODELS = [];
      }
      if(!STT_MODELS.length){
        STT_MODELS = [{id:'local-whisper', label:'Whisper Local (fallback)', type:'local'}];
      }
      for(const m of STT_MODELS){
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label || m.id;
        sel.appendChild(opt);
      }
      if(STT_MODELS.some(m => m.id === STT_DEFAULT_MODEL_ID)){
        sel.value = STT_DEFAULT_MODEL_ID;
      }else{
        sel.value = STT_MODELS[0].id;
      }
    }

    function selectedGuardrailMode(){
      return (document.getElementById('guardrailMode').value || 'iso_only').trim();
    }

    function onGuardrailModeChange(){
      const mode = selectedGuardrailMode();
      const badge = document.getElementById('guardrailModeBadge');
      const note = document.getElementById('guardrailModeNote');
      badge.textContent = mode;
      if(mode === 'cv_analysis'){
        badge.className = 'badge badge-openai';
        note.textContent = 'CV mode: allows resume/candidate analysis requests.';
      }else if(mode === 'speech_any_subject'){
        badge.className = 'badge badge-custom';
        note.textContent = 'Speech/Text analyzer mode: allows any subject.';
      }else{
        badge.className = 'badge badge-rhoai';
        note.textContent = 'ISO mode: only Red Hat / ISO scope is allowed.';
      }
    }

    function selectedSpeechLangCode(){
      const val = (document.getElementById('speechLang').value || 'auto').toLowerCase();
      if(['en','he','ar'].includes(val)) return val;
      return 'auto';
    }

    function selectedRecognitionLocale(){
      const code = selectedSpeechLangCode();
      if(code === 'auto'){
        if((SPEECH_RECOGNITION_LANG || '').toLowerCase().startsWith('en')) return 'en-US';
        if((SPEECH_RECOGNITION_LANG || '').toLowerCase().startsWith('ar')) return 'ar-SA';
        return 'he-IL';
      }
      return SPEECH_LANG_MAP[code] || 'he-IL';
    }

    function ensureSpeechRecognizer(){
      if(!SpeechRecognitionCtor){
        setSpeechStatus('Browser speech recognition not supported');
        return false;
      }
      if(speechRecognizer) return true;
      speechRecognizer = new SpeechRecognitionCtor();
      speechRecognizer.lang = selectedRecognitionLocale();
      speechRecognizer.continuous = true;
      speechRecognizer.interimResults = true;
      speechRecognizer.onstart = () => { setSpeechStatus('Listening…'); };
      speechRecognizer.onerror = (e) => { setSpeechStatus('Speech error: ' + (e.error || 'unknown')); };
      speechRecognizer.onend = () => {
        if(document.getElementById('speechStatus').textContent === 'Listening…') setSpeechStatus('Idle');
      };
      speechRecognizer.onresult = (event) => {
        let interim = '';
        for(let i = event.resultIndex; i < event.results.length; i++){
          const txt = event.results[i][0].transcript || '';
          if(event.results[i].isFinal) speechTranscriptFinal += txt + ' ';
          else interim += txt;
        }
        document.getElementById('speechTranscript').value = (speechTranscriptFinal + interim).trim();
      };
      return true;
    }

    function startSpeech(){
      if(!ensureSpeechRecognizer()) return;
      speechRecognizer.lang = selectedRecognitionLocale();
      try{ speechRecognizer.start(); }catch(_e){}
    }

    function stopSpeech(){
      if(!speechRecognizer) return;
      speechRecognizer.stop();
      setSpeechStatus('Stopped');
    }

    async function pollSpeechTranscriptionJob(jobId){
      const started = Date.now();
      while(true){
        await new Promise(resolve => setTimeout(resolve, 3000));
        const res = await fetch(`/speech/transcribe/${encodeURIComponent(jobId)}`);
        let d = null;
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if(ct.includes('application/json')){
          d = await res.json();
        }else{
          const txt = await res.text();
          d = { error: txt ? txt.slice(0, 280) : `HTTP ${res.status}` };
        }
        if(res.status === 202 && (d.status || '').toLowerCase() === 'processing'){
          const sec = Math.max(1, Math.round((Date.now() - started) / 1000));
          setSpeechStatus(`Transcribing audio… ${sec}s`);
          continue;
        }
        return d;
      }
    }

    async function transcribeSpeech(){
      const fileInput = document.getElementById('speechFile');
      const file = fileInput.files && fileInput.files[0];
      const langVal = selectedSpeechLangCode();
      const sttModel = selectedSttModelId();
      if(!file){
        setSpeechStatus('Select an audio file first');
        return;
      }
      setSpeechStatus('Uploading audio…');
      const btn = document.getElementById('speechTranscribeBtn');
      btn.disabled = true;
      const fd = new FormData();
      fd.append('audio', file);
      fd.append('stt_model', sttModel);
      if(langVal && langVal !== 'auto'){
        fd.append('language', langVal);
      }
      try{
        const res = await fetch('/speech/transcribe', {method:'POST', body: fd});
        let d = null;
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if(ct.includes('application/json')){
          d = await res.json();
        }else{
          const txt = await res.text();
          d = { error: txt ? txt.slice(0, 280) : `HTTP ${res.status}` };
        }
        if(res.status === 202 && d && d.job_id){
          setSpeechStatus('Transcribing audio…');
          d = await pollSpeechTranscriptionJob(d.job_id);
        }
        if(d.error){
          let err = d.error;
          if (typeof err !== 'string') {
            err = (err && (err.message || err.error || err.detail)) || JSON.stringify(err || d.details || 'transcription failed');
          }
          const errLow = String(err || '').toLowerCase();
          if (res.status === 413) {
            setSpeechStatus('File too large');
          } else if (
            res.status === 422 ||
            errLow.includes('unsupported') ||
            errLow.includes('invalid audio') ||
            errLow.includes('codec') ||
            errLow.includes('container') ||
            errLow.includes('format')
          ) {
            setSpeechStatus('Unsupported audio format');
          } else {
            setSpeechStatus('Transcription error');
          }
          document.getElementById('speechMeta').textContent = err;
          return;
        }
        document.getElementById('speechTranscript').value = d.transcript || '';
        const model = d.model_name || '?';
        const detLang = d.detected_language || 'unknown';
        const dur = d.duration_seconds ? `${Number(d.duration_seconds).toFixed(1)}s` : 'n/a';
        const provider = d.provider || 'unknown';
        const fallback = d.fallback_note ? ` · ${d.fallback_note}` : '';
        setSpeechStatus('Transcribed');
        document.getElementById('speechMeta').textContent = `STT model: ${model} · provider: ${provider} · detected: ${detLang} · audio: ${dur}${fallback}`;
      }catch(e){
        setSpeechStatus('Network error');
        document.getElementById('speechMeta').textContent = e.message;
      }finally{
        btn.disabled = false;
      }
    }

    async function summarizeSpeech(){
      const transcript = document.getElementById('speechTranscript').value.trim();
      const model = document.getElementById('modelSel').value;
      const guardrailMode = selectedGuardrailMode();
      const prompt = document.getElementById('speechSummaryPrompt').value.trim();
      const r = document.getElementById('speechResp');
      const meta = document.getElementById('speechMeta');
      const btn = document.getElementById('speechSummarizeBtn');
      if(!transcript){
        setSpeechStatus('Transcript is empty');
        return;
      }
      const wrapped = `${prompt}\n\nTranscript:\n${transcript}`;
      r.className = 'resp loading'; r.innerHTML = '<div class="spinner"></div>&nbsp;Summarizing…';
      meta.textContent = '';
      btn.disabled = true;
      const t0 = Date.now();
      try{
        const res = await fetch('/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:wrapped,model,guardrail_mode:guardrailMode})});
        const d = await res.json();
        const el = ((Date.now()-t0)/1000).toFixed(1);
        if(d.error){r.className='resp error';r.textContent='Error: '+d.error;}
        else if(d.blocked){r.className='resp blocked';r.textContent='🚫 Blocked by guardrails:\n\n'+d.response;}
        else{r.className='resp ok';r.textContent=d.response;}
        meta.textContent = `Model: ${d.model||model} · ${el}s · ${d.tokens||'?'} tokens`;
      }catch(e){
        r.className='resp error';
        r.textContent='Network error: '+e.message;
      }finally{
        btn.disabled = false;
      }
    }

