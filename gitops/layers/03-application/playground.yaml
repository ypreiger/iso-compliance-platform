    /* TrustyAI status polling */
    async function pollStatus(){
      try{
        const r=await fetch('/status');
        const d=await r.json();
        const tai=d.trustyai||{};
        const setb=(id,ok,txt)=>{
          const el=document.getElementById(id);
          el.textContent=txt; el.className='status-badge '+(ok?'status-up':ok===null?'status-partial':'status-down');
        };
        setb('tai-svc', tai.available, tai.available?'UP':'DOWN');
        setb('tai-live', tai.liveness==='UP', tai.liveness||'?');
        setb('tai-data', tai.data==='UP', tai.data||'?');
        const g=d.guardrails||{};
        // Guardrails: show app-level as always active; orchestrator-level as secondary
        const guardTxt = g.available ? 'HAP + Topic filter' : (g.app_guardrails ? 'Topic filter active' : 'Inactive');
        setb('tai-guard', g.available || g.app_guardrails, guardTxt);
        const stt = d.stt || {};
        const sttTxt = stt.available ? `${stt.model_name || 'ready'} (${stt.model_device || '?'})` : (stt.reason || 'DOWN');
        setb('stt-svc', stt.available, sttTxt);
        document.getElementById('trustyaiDot').style.background=tai.available?'#28a745':'#ffc107';
        document.getElementById('trustyaiLabel').textContent=tai.available?'UP':'checking';
      }catch(e){
        document.getElementById('trustyaiLabel').textContent='unavailable';
        document.getElementById('stt-svc').textContent='unavailable';
      }
      setTimeout(pollStatus,15000);
    }
    pollStatus();
    </script>
    </body></html>'''

    # ── routes ─────────────────────────────────────────────────────────────
    @app.route('/')
    def home():
        models_for_template = [m for m in MODELS]
        models_json = json.dumps([{k:v for k,v in m.items() if not k.startswith('_')} | {"_disabled":m.get("_disabled",False)} for m in MODELS])
        return render_template_string(
            HTML,
            title=TITLE,
            subtitle=SUBTITLE,
            rhoai_url=RHOAI_URL,
            models=models_for_template,
            models_json=models_json,
            default_model_id=DEFAULT_MODEL_ID,
            guardrail_default_mode=GUARDRAIL_DEFAULT_MODE,
            stt_default_model_id=STT_DEFAULT_MODEL_ID,
            speech_summary_prompt=SPEECH_SUMMARY_PROMPT,
            speech_recognition_lang=SPEECH_RECOGNITION_LANG,
            file_analysis_system_prompt=FILE_ANALYSIS_SYSTEM_PROMPT,
        )

    @app.route('/chat', methods=['POST'])
    def chat():
        data = request.json or {}
        msg   = data.get('message', '').strip()
        guardrail_mode = (data.get("guardrail_mode") or GUARDRAIL_DEFAULT_MODE or "iso_only").strip().lower()
        mid   = data.get('model') or DEFAULT_MODEL_ID or (MODELS[0]['id'] if MODELS else 'unknown')
        model = next((m for m in MODELS if m['id'] == mid), None)
        if model is None:
            return jsonify({'error': f'Unknown model: {mid}'}), 400
        if model.get('_disabled'):
            return jsonify({'error': model.get('_disabled_reason', 'Model unavailable')}), 503
        if not _allowed(msg, guardrail_mode):
            USAGE[mid]["blocked"] += 1
            return jsonify({'blocked': True, 'response': f'Blocked by guardrails mode "{guardrail_mode}".'})
        token = _get_token(model.get('auth', 'none'))
        if not token and model.get('auth') != 'none':
            USAGE[mid]["errors"] += 1
            return jsonify({'error': f'No credentials for model {mid}'}), 503
        try:
            sys_prompt = _system_prompt_for_mode(guardrail_mode)
            client = openai.OpenAI(base_url=model['url'], api_key=token or 'none')
            resp = client.chat.completions.create(
                model=mid,
                messages=[{"role": "system", "content": sys_prompt}, {"role": "user", "content": msg}],
                max_tokens=2048,
                temperature=0.7,
            )
            content = resp.choices[0].message.content
            tokens  = resp.usage.total_tokens if resp.usage else None
            USAGE[mid]["requests"] += 1
            if tokens:
                USAGE[mid]["tokens"] += int(tokens)
            return jsonify({'response': content, 'model': mid, 'blocked': False, 'tokens': tokens})
        except Exception as exc:
            USAGE[mid]["errors"] += 1
            return jsonify({'error': str(exc)[:300]}), 500

    @app.route('/speech/models')
    def speech_models():
        return jsonify({"models": _stt_models(force_refresh=True), "default_model_id": STT_DEFAULT_MODEL_ID})

    @app.route('/speech/transcribe', methods=['POST'])
    def speech_transcribe():
        _cleanup_stt_jobs()
        try:
            audio = request.files.get("audio") or request.files.get("file")
        except Exception as exc:
            return jsonify({"error": f"invalid upload form-data: {str(exc)[:180]}"}), 400
        if audio is None or not audio.filename:
            return jsonify({"error": "missing multipart file field 'audio'"}), 400
        language = (request.form.get("language") or "").strip().lower()
        if language.startswith("en"):
            language = "en"
        elif language.startswith("he"):
            language = "he"
        elif language.startswith("ar"):
            language = "ar"
        else:
            language = ""
        selected_model_id = (request.form.get("stt_model") or STT_DEFAULT_MODEL_ID or "local-whisper").strip()
        stt_model = _stt_model_by_id(selected_model_id)
        if stt_model is None:
            return jsonify({"error": f"unknown stt model: {selected_model_id}"}), 400

        audio_bytes = audio.read()
        if not audio_bytes:
            return jsonify({"error": "empty audio payload"}), 400
        max_bytes = STT_MAX_AUDIO_MB * 1024 * 1024
        if len(audio_bytes) > max_bytes:
            return jsonify({"error": f"audio exceeds max size ({STT_MAX_AUDIO_MB}MB)"}), 413

        async_raw = request.form.get("async")
        if async_raw is None:
            async_raw = request.args.get("async")
        async_mode = STT_ASYNC_DEFAULT if async_raw is None else str(async_raw).strip().lower() not in ("0", "false", "no")
        if async_mode:
            job_id = str(uuid.uuid4())
            _set_stt_job(
                job_id,
                {
                    "status": "processing",
                    "http_status": 202,
                    "result": {"job_id": job_id, "status": "processing"},
                },
            )
            thread = threading.Thread(
                target=_run_stt_job,
                kwargs={
                    "job_id": job_id,
                    "audio_filename": audio.filename,
                    "audio_bytes": audio_bytes,
                    "audio_mimetype": audio.mimetype or "application/octet-stream",
                    "language": language,
                    "selected_model_id": selected_model_id,
                },
                daemon=True,
            )
            thread.start()
            return jsonify({"job_id": job_id, "status": "processing"}), 202

        result, status_code = _transcribe_audio_bytes(
            audio_filename=audio.filename,
            audio_bytes=audio_bytes,
            audio_mimetype=audio.mimetype or "application/octet-stream",
            language=language,
            selected_model_id=selected_model_id,
        )
        return jsonify(result), status_code

    @app.route('/speech/transcribe/<job_id>', methods=['GET'])
    def speech_transcribe_status(job_id: str):
        _cleanup_stt_jobs()
        job = _get_stt_job(job_id)
        if not job:
            return jsonify({"error": "job not found"}), 404
        status = (job.get("status") or "").lower()
        if status == "processing":
            return jsonify({"job_id": job_id, "status": "processing"}), 202
        result = job.get("result") if isinstance(job.get("result"), dict) else {}
        http_status = int(job.get("http_status") or (200 if status == "done" else 500))
        return jsonify(result), http_status

    @app.route('/file/analyze', methods=['POST'])
    def file_analyze():
        uploaded = request.files.get("file")
        if uploaded is None or not uploaded.filename:
            return jsonify({"error": "missing multipart file field 'file'"}), 400
        model_id = (request.form.get("model") or DEFAULT_MODEL_ID or (MODELS[0]["id"] if MODELS else "unknown")).strip()
        requested_guardrail_mode = (request.form.get("guardrail_mode") or GUARDRAIL_DEFAULT_MODE or "iso_only").strip().lower()
        criteria = (request.form.get("criteria") or "").strip()
        requested_system_prompt = (request.form.get("system_prompt") or "").strip()
        language = (request.form.get("language") or FILE_PARSE_LANGUAGE).strip().lower()
        if language.startswith("en"):
            language = "en"
        elif language.startswith("ar"):
            language = "ar"
        else:
            language = "he"
        if not criteria:
            return jsonify({"error": "criteria is required"}), 400

        model = next((m for m in MODELS if m["id"] == model_id), None)
        if model is None:
            return jsonify({"error": f"Unknown model: {model_id}"}), 400
        if model.get("_disabled"):
            return jsonify({"error": model.get("_disabled_reason", "Model unavailable")}), 503

        data = uploaded.read()
        if not data:
            return jsonify({"error": "uploaded file is empty"}), 400
        if len(data) > FILE_ANALYSIS_MAX_MB * 1024 * 1024:
            return jsonify({"error": f"file exceeds max size {FILE_ANALYSIS_MAX_MB} MB"}), 413

        try:
            extracted_text, extract_meta = _extract_text_from_uploaded_file(uploaded.filename, data, language)
        except Exception as exc:
            return jsonify({"error": f"file extraction failed: {str(exc)[:220]}"}), 422

        guardrail_mode = _resolve_guardrail_mode(
            requested_guardrail_mode,
            criteria=criteria,
            filename=uploaded.filename,
            extracted_text=extracted_text,
        )
        if not _allowed(criteria, guardrail_mode, uploaded.filename):
            USAGE[model_id]["blocked"] += 1
            return jsonify(
                {
                    "blocked": True,
                    "response": f'Blocked by guardrails mode "{guardrail_mode}".',
                    "guardrail_mode_requested": requested_guardrail_mode,
                    "guardrail_mode_effective": guardrail_mode,
                }
            )

        system_prompt = requested_system_prompt or (
            CV_SYSTEM_PROMPT if guardrail_mode == "cv_analysis" else FILE_ANALYSIS_SYSTEM_PROMPT
        )

        truncated = False
        if len(extracted_text) > FILE_ANALYSIS_MAX_CHARS:
            extracted_text = extracted_text[:FILE_ANALYSIS_MAX_CHARS]
            truncated = True

        token = _get_token(model.get("auth", "none"))
        if not token and model.get("auth") != "none":
            USAGE[model_id]["errors"] += 1
            return jsonify({"error": f"No credentials for model {model_id}"}), 503

        prompt = (
            f"User analysis criteria:\n{criteria}\n\n"
            f"Uploaded file name: {uploaded.filename}\n\n"
            "Extracted file content:\n"
            f"{extracted_text}"
        )
        try:
            client = openai.OpenAI(base_url=model["url"], api_key=token or "none")
            resp = client.chat.completions.create(
                model=model_id,
                messages=[{"role": "system", "content": system_prompt}, {"role": "user", "content": prompt}],
                max_tokens=2048,
                temperature=0.2,
            )
            content = resp.choices[0].message.content
            tokens = resp.usage.total_tokens if resp.usage else None
            USAGE[model_id]["requests"] += 1
            if tokens:
                USAGE[model_id]["tokens"] += int(tokens)
            return jsonify(
                {
                    "response": content,
                    "blocked": False,
                    "model": model_id,
                    "tokens": tokens,
                    "file_source": extract_meta.get("source"),
                    "file_parse_method": extract_meta.get("parse_method"),
                    "file_parse_model": extract_meta.get("model_used"),
                    "file_warnings": extract_meta.get("warnings", []),
                    "file_chars": len(extracted_text),
                    "file_truncated": truncated,
                    "guardrail_mode_requested": requested_guardrail_mode,
                    "guardrail_mode_effective": guardrail_mode,
                }
            )
        except Exception as exc:
            USAGE[model_id]["errors"] += 1
            return jsonify({"error": str(exc)[:300]}), 500

    @app.route('/status')
    def status():
        return jsonify({
            'trustyai': _trustyai_status(),
            'guardrails': _guardrails_status(),
            'guardrail_default_mode': GUARDRAIL_DEFAULT_MODE,
            'guardrail_modes': ['iso_only', 'cv_analysis', 'speech_any_subject'],
            'stt': _stt_status(),
            'models': len([m for m in MODELS if not m.get('_disabled')]),
            'usage_by_model': dict(USAGE),
        })

    @app.route('/metrics')
    def metrics():
        lines = [
            "# HELP playground_model_requests_total Successful model responses.",
            "# TYPE playground_model_requests_total counter",
            "# HELP playground_model_blocked_total Requests blocked by guardrails.",
            "# TYPE playground_model_blocked_total counter",
            "# HELP playground_model_errors_total Model request errors.",
            "# TYPE playground_model_errors_total counter",
            "# HELP playground_model_tokens_total Total response tokens by model.",
            "# TYPE playground_model_tokens_total counter",
        ]
        for model_id, vals in USAGE.items():
            safe = model_id.replace("\\", "\\\\").replace('"', '\\"')
            lines.append(f'playground_model_requests_total{{model_id="{safe}"}} {vals["requests"]}')
            lines.append(f'playground_model_blocked_total{{model_id="{safe}"}} {vals["blocked"]}')
            lines.append(f'playground_model_errors_total{{model_id="{safe}"}} {vals["errors"]}')
            lines.append(f'playground_model_tokens_total{{model_id="{safe}"}} {vals["tokens"]}')
        return "\\n".join(lines) + "\\n", 200, {"Content-Type": "text/plain; version=0.0.4"}

    @app.route('/health')
    def health():
        return jsonify({
            'status': 'healthy',
            'maas_token': MAAS_TOKEN_FILE.exists(),
            'openai_key': bool(OPENAI_KEY),
            'models': len(MODELS),
            'models_available': len([m for m in MODELS if not m.get('_disabled')]),
            'trustyai_url': TRUSTYAI_URL,
            'stt_service_url': STT_SERVICE_URL,
            'stt_models': _stt_models(),
            'rhoai_url': RHOAI_URL,
        })

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8080)

