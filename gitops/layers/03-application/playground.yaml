apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: playground
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playground
    spec:
      serviceAccountName: default
      containers:
        - name: playground
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            [
              "sh",
              "-c",
              "pip install flask openai httpx gunicorn redis --quiet && gunicorn --workers 2 --threads 8 --timeout 1200 --bind 0.0.0.0:8080 --chdir /app app:app",
            ]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
            - name: maas-token
              mountPath: /var/run/secrets/maas
              readOnly: true
          # Models config (URLs, labels, providers) — no secrets
          envFrom:
            - configMapRef:
                name: playground-models-config
          env:
            # OpenAI API key from secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
                  optional: true
            - name: REDIS_URL
              value: "redis://iso-redis:6379/1"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 30
      volumes:
        - name: app
          configMap:
            name: playground-app
        - name: maas-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: maas-default-gateway-sa
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
spec:
  selector:
    app.kubernetes.io/name: playground
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
  annotations:
    haproxy.router.openshift.io/timeout: "600s"
spec:
  to:
    kind: Service
    name: playground
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
