---
# Unified AI Playground — all models in one UI
# All configuration (model list, URLs, prompts) is external via ConfigMaps/Secrets.
# App.py reads MODELS_CONFIG JSON at startup — zero hardcoded endpoints.
apiVersion: v1
kind: ConfigMap
metadata:
  name: playground-app
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: playground
data:
  app.py: |
    """Unified ISO Compliance AI Playground.

    Configuration is fully external:
      MODELS_CONFIG       JSON array of model descriptors (from playground-models-config)
      SYSTEM_PROMPT       LLM system prompt
      ALLOWED_TOPICS      comma-separated keyword allow-list for topic guardrails
      RHOAI_DASHBOARD_URL RHOAI dashboard link
      TRUSTYAI_URL        internal TrustyAI REST endpoint
      OPENAI_API_KEY      secret (optional, for OpenAI models)
      MaaS token          projected SA token at /var/run/secrets/maas/token
    """
    from __future__ import annotations
    import os, json, time
    from pathlib import Path
    from flask import Flask, request, jsonify, render_template_string
    import openai, httpx

    app = Flask(__name__)

    # ── config ─────────────────────────────────────────────────────────────
    MAAS_TOKEN_FILE = Path("/var/run/secrets/maas/token")
    OPENAI_KEY      = os.getenv("OPENAI_API_KEY", "")
    RHOAI_URL       = os.getenv("RHOAI_DASHBOARD_URL", "")
    TRUSTYAI_URL    = os.getenv("TRUSTYAI_URL", "")
    TITLE           = os.getenv("PLAYGROUND_TITLE", "AI Playground")
    SUBTITLE        = os.getenv("PLAYGROUND_SUBTITLE", "Red Hat OpenShift AI")

    ALLOWED_TOPICS  = [t.strip() for t in os.getenv("ALLOWED_TOPICS", "red hat,iso").split(",") if t.strip()]
    SYSTEM_PROMPT   = os.getenv("SYSTEM_PROMPT", "You are a helpful assistant.")

    def _load_models() -> list[dict]:
        raw = os.getenv("MODELS_CONFIG", "[]")
        try:
            models = json.loads(raw)
            maas_token = MAAS_TOKEN_FILE.read_text().strip() if MAAS_TOKEN_FILE.exists() else ""
            result = []
            for m in models:
                auth = m.get("auth", "none")
                if auth == "openai_key" and not OPENAI_KEY:
                    m["_disabled"] = True
                    m["_disabled_reason"] = "OPENAI_API_KEY not set"
                elif auth == "maas_token" and not maas_token:
                    m["_disabled"] = True
                    m["_disabled_reason"] = "MaaS SA token not available"
                else:
                    m["_disabled"] = False
                result.append(m)
            return result
        except Exception as exc:
            return [{"id": "error", "label": f"Config error: {exc}", "_disabled": True}]

    MODELS = _load_models()

    def _get_token(auth_type: str) -> str:
        if auth_type == "openai_key":
            return OPENAI_KEY
        if auth_type == "maas_token":
            if MAAS_TOKEN_FILE.exists():
                return MAAS_TOKEN_FILE.read_text().strip()
        return ""

    # ── TrustyAI status ────────────────────────────────────────────────────
    def _trustyai_status() -> dict:
        if not TRUSTYAI_URL:
            return {"available": False, "reason": "TRUSTYAI_URL not configured"}
        try:
            resp = httpx.get(f"{TRUSTYAI_URL}/q/health", timeout=3, verify=False)
            data = resp.json()
            checks = {c["name"]: c["status"] for c in data.get("checks", [])}
            return {
                "available": data.get("status") == "UP",
                "status": data.get("status", "UNKNOWN"),
                "liveness": checks.get("Liveness", "?"),
                "data": checks.get("Data", "?"),
            }
        except Exception as exc:
            return {"available": False, "reason": str(exc)[:80]}

    def _guardrails_status() -> dict:
        url = os.getenv("GUARDRAILS_ORCHESTRATOR_URL", "")
        if not url:
            return {"available": False}
        try:
            resp = httpx.get(f"{url}/health", timeout=2, verify=False)
            return {"available": resp.status_code == 200}
        except Exception:
            return {"available": False}

    # ── topic guardrails ───────────────────────────────────────────────────
    def _allowed(msg: str) -> bool:
        low = msg.lower()
        return any(kw in low for kw in ALLOWED_TOPICS)

    # ── HTML ───────────────────────────────────────────────────────────────
    HTML = r'''<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ title }}</title>
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;padding:20px}
    .wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
    .main-card,.side-card{background:white;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
    /* header */
    .hdr{background:linear-gradient(135deg,#ee0000,#a00000);color:white;padding:22px 28px;display:flex;align-items:center;gap:16px}
    .hdr h1{font-size:22px;font-weight:700}
    .hdr p{opacity:.85;font-size:12px;margin-top:3px}
    .rhoai-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:12px;text-decoration:none;color:white;white-space:nowrap;transition:.2s}
    .rhoai-btn:hover{background:rgba(255,255,255,.25)}
    /* info bar */
    .info-bar{background:#f8f9fa;padding:10px 28px;display:flex;flex-wrap:wrap;gap:18px;font-size:12px;border-bottom:1px solid #e9ecef}
    .info-pill{display:flex;align-items:center;gap:6px;color:#495057}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .dot-green{background:#28a745} .dot-red{background:#ee0000} .dot-amber{background:#ffc107} .dot-grey{background:#6c757d}
    /* body */
    .body{padding:22px 28px}
    /* model row */
    .model-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
    .model-row label{font-weight:600;font-size:14px;color:#343a40;white-space:nowrap}
    .model-row select{flex:1;min-width:260px;padding:9px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:14px;background:white;cursor:pointer}
    .model-row select:focus{outline:none;border-color:#ee0000}
    .badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700}
    .badge-rhoai{background:#e8f4fd;color:#1565c0}
    .badge-openai{background:#e8f5e9;color:#2e7d32}
    .badge-custom{background:#f3e5f5;color:#6a1b9a}
    .badge-disabled{background:#f5f5f5;color:#9e9e9e}
    /* model note */
    .model-note{font-size:12px;color:#6c757d;margin-bottom:14px;min-height:16px}
    /* guardrails notice */
    .guard-banner{background:#e8f4fd;border:1px solid #bee5eb;border-radius:8px;padding:10px 14px;font-size:13px;color:#0c5460;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px}
    .guard-banner .icon{font-size:16px;flex-shrink:0}
    /* textarea */
    textarea{width:100%;min-height:110px;padding:14px;border:2px solid #dee2e6;border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;transition:.2s}
    textarea:focus{outline:none;border-color:#ee0000}
    /* buttons */
    .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
    button{padding:11px 24px;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:.2s}
    .btn-send{background:linear-gradient(135deg,#ee0000,#a00000);color:white}
    .btn-send:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(238,0,0,.4)}
    .btn-send:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-clear{background:#f8f9fa;color:#495057;border:1px solid #dee2e6}
    .btn-clear:hover{background:#e9ecef}
    /* response */
    .resp{border:2px solid #dee2e6;border-radius:10px;padding:18px;min-height:140px;margin-top:18px;line-height:1.7;white-space:pre-wrap;font-size:14px;color:#212529}
    .resp.loading{display:flex;align-items:center;justify-content:center;color:#666}
    .resp.ok{border-color:#c3e6cb;background:#f0fff4}
    .resp.error{border-color:#f5c6cb;background:#fff5f5;color:#721c24}
    .resp.blocked{border-color:#ffeeba;background:#fffdf0;color:#856404}
    .spinner{border:3px solid #eee;border-top:3px solid #ee0000;border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .meta{margin-top:8px;font-size:12px;color:#6c757d}
    /* sidebar */
    .side-card .hdr{padding:16px 20px}
    .side-card .hdr h1{font-size:16px}
    .side-section{padding:16px 20px;border-bottom:1px solid #f0f0f0}
    .side-section h3{font-size:13px;font-weight:700;color:#343a40;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
    .stat-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
    .stat-val{font-weight:600;color:#343a40}
    .status-badge{padding:2px 7px;border-radius:8px;font-size:11px;font-weight:700}
    .status-up{background:#d4edda;color:#155724}
    .status-down{background:#f8d7da;color:#721c24}
    .status-partial{background:#fff3cd;color:#856404}
    .model-chip{background:#f8f9fa;border:1px solid #dee2e6;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:6px}
    .model-chip .chip-label{font-weight:600;color:#343a40}
    .model-chip .chip-note{color:#6c757d;font-size:11px}
    .chip-badge{float:right;margin-top:2px}
    @media(max-width:900px){.wrap{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <div class="wrap">
    <!-- main chat -->
    <div class="main-card">
      <div class="hdr">
        <div style="flex:1">
          <h1>🤖 {{ title }}</h1>
          <p>{{ subtitle }}</p>
        </div>
        <a class="rhoai-btn" href="{{ rhoai_url }}" target="_blank">📊 RHOAI Dashboard</a>
      </div>
      <div class="info-bar">
        <div class="info-pill"><div class="dot dot-green" id="modelDot"></div><span id="modelStatus">Select a model</span></div>
        <div class="info-pill"><div class="dot" id="guardrailsDot" style="background:#28a745"></div><span>Guardrails: <span id="guardrailsLabel">active</span></span></div>
        <div class="info-pill"><div class="dot" id="trustyaiDot" style="background:#ffc107"></div><span>TrustyAI: <span id="trustyaiLabel">checking…</span></span></div>
        <div class="info-pill" id="contextPill" style="display:none"><span id="contextLabel"></span></div>
      </div>
      <div class="body">
        <div class="guard-banner">
          <span class="icon">🛡️</span>
          <span><strong>TrustyAI Guardrails</strong> — topic filter active. Red Hat + ISO + AI topics only.
          All inferences are logged to TrustyAI for drift &amp; fairness monitoring.</span>
        </div>
        <div class="model-row">
          <label for="modelSel">Model:</label>
          <select id="modelSel" onchange="onModel()">
            {% for m in models %}
            <option value="{{ m.id }}" data-provider="{{ m.provider }}" data-note="{{ m.get('note','') }}" {% if m.get('_disabled') %}disabled{% endif %}>
              {% if m.get('_disabled') %}[unavailable] {% endif %}{{ m.label }}
            </option>
            {% endfor %}
          </select>
          <span id="providerBadge" class="badge badge-rhoai"></span>
        </div>
        <div class="model-note" id="modelNote"></div>
        <textarea id="prompt" placeholder="Ask about Red Hat products, ISO standards, or AI/ML topics… (Ctrl+Enter to send)">What is Red Hat OpenShift AI and how does it support ISO 27001 compliance?</textarea>
        <div class="btn-row">
          <button class="btn-send" id="sendBtn" onclick="send()">Send</button>
          <button class="btn-clear" onclick="clearChat()">Clear</button>
        </div>
        <div class="resp" id="resp">Response will appear here…</div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <!-- sidebar -->
    <div class="side-card">
      <div class="hdr">
        <div>
          <h1>⚡ AI Status</h1>
          <p>RHOAI · TrustyAI · MaaS</p>
        </div>
      </div>
      <!-- TrustyAI -->
      <div class="side-section">
        <h3>TrustyAI</h3>
        <div class="stat-row"><span>Service</span><span id="tai-svc" class="status-badge status-partial">checking…</span></div>
        <div class="stat-row"><span>Liveness</span><span id="tai-live" class="status-badge status-partial">…</span></div>
        <div class="stat-row"><span>Data store</span><span id="tai-data" class="status-badge status-partial">…</span></div>
        <div class="stat-row"><span>Guardrails orch</span><span id="tai-guard" class="status-badge status-partial">…</span></div>
        <div style="margin-top:10px">
          <a href="{{ rhoai_url }}/projects/llm" target="_blank" style="font-size:12px;color:#0d6efd">→ View in RHOAI Dashboard</a>
        </div>
      </div>
      <!-- MaaS models -->
      <div class="side-section">
        <h3>Available Models</h3>
        {% for m in models %}
        <div class="model-chip">
          <span class="chip-badge badge {{ 'badge-rhoai' if m.provider=='rhoai' else 'badge-openai' if m.provider=='openai' else 'badge-custom' }}">
            {{ m.provider }}
          </span>
          <div class="chip-label">{{ m.id }}</div>
          {% if m.get('note') %}<div class="chip-note">{{ m.note }}</div>{% endif %}
          {% if m.get('_disabled') %}<div class="chip-note" style="color:#e53935">⚠ {{ m.get('_disabled_reason','unavailable') }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <!-- links -->
      <div class="side-section">
        <h3>Quick Links</h3>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:13px">
          <a href="{{ rhoai_url }}" target="_blank">📊 RHOAI Dashboard</a>
          <a href="{{ rhoai_url }}/projects/llm" target="_blank">🗂 Project: llm</a>
          <a href="{{ rhoai_url }}/modelServing/llm" target="_blank">🤖 Model Serving</a>
          <a href="https://iso-web-iso-platform.apps.ocp.8mkwb.sandbox3159.opentlc.com" target="_blank">📋 ISO Viewer</a>
        </div>
      </div>
    </div>
    </div>
    <script>
    const MODELS = {{ models_json }};
    function onModel(){
      const sel = document.getElementById('modelSel');
      const opt = sel.options[sel.selectedIndex];
      const m = MODELS.find(x=>x.id===sel.value)||{};
      const p = m.provider||'';
      document.getElementById('providerBadge').textContent = m.label||sel.value;
      document.getElementById('providerBadge').className = 'badge '+(p==='rhoai'?'badge-rhoai':p==='openai'?'badge-openai':'badge-custom');
      document.getElementById('modelNote').textContent = m.note||'';
      document.getElementById('modelStatus').textContent = 'Model: '+sel.value;
      document.getElementById('modelDot').style.background = m._disabled?'#ffc107':'#28a745';
    }
    onModel();

    async function send(){
      const prompt=document.getElementById('prompt').value.trim();
      if(!prompt)return;
      const model=document.getElementById('modelSel').value;
      const r=document.getElementById('resp'); const btn=document.getElementById('sendBtn');
      r.className='resp loading'; r.innerHTML='<div class="spinner"></div>&nbsp;Thinking…';
      btn.disabled=true; document.getElementById('meta').textContent='';
      const t0=Date.now();
      try{
        const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:prompt,model})});
        const d=await res.json();
        const el=((Date.now()-t0)/1000).toFixed(1);
        if(d.error){r.className='resp error';r.textContent='Error: '+d.error;}
        else if(d.blocked){r.className='resp blocked';r.textContent='🚫 Blocked by guardrails:\n\n'+d.response;}
        else{r.className='resp ok';r.textContent=d.response;}
        document.getElementById('meta').textContent=`Model: ${d.model||model} · ${el}s · ${d.tokens||'?'} tokens`;
      }catch(e){r.className='resp error';r.textContent='Network error: '+e.message;}
      finally{btn.disabled=false;}
    }
    function clearChat(){
      document.getElementById('prompt').value='';
      const r=document.getElementById('resp');
      r.className='resp'; r.textContent='Response will appear here…';
      document.getElementById('meta').textContent='';
    }
    document.getElementById('prompt').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')send();});

    /* TrustyAI status polling */
    async function pollStatus(){
      try{
        const r=await fetch('/status');
        const d=await r.json();
        const tai=d.trustyai||{};
        const setb=(id,ok,txt)=>{
          const el=document.getElementById(id);
          el.textContent=txt; el.className='status-badge '+(ok?'status-up':ok===null?'status-partial':'status-down');
        };
        setb('tai-svc', tai.available, tai.available?'UP':'DOWN');
        setb('tai-live', tai.liveness==='UP', tai.liveness||'?');
        setb('tai-data', tai.data==='UP', tai.data||'?');
        const g=d.guardrails||{};
        setb('tai-guard', g.available, g.available?'Running':'Degraded');
        document.getElementById('trustyaiDot').style.background=tai.available?'#28a745':'#ffc107';
        document.getElementById('trustyaiLabel').textContent=tai.available?'UP':'checking';
      }catch(e){
        document.getElementById('trustyaiLabel').textContent='unavailable';
      }
      setTimeout(pollStatus,15000);
    }
    pollStatus();
    </script>
    </body></html>'''

    # ── routes ─────────────────────────────────────────────────────────────
    @app.route('/')
    def home():
        models_for_template = [m for m in MODELS]
        models_json = json.dumps([{k:v for k,v in m.items() if not k.startswith('_')} | {"_disabled":m.get("_disabled",False)} for m in MODELS])
        return render_template_string(
            HTML,
            title=TITLE,
            subtitle=SUBTITLE,
            rhoai_url=RHOAI_URL,
            models=models_for_template,
            models_json=models_json,
        )

    @app.route('/chat', methods=['POST'])
    def chat():
        data = request.json or {}
        msg   = data.get('message', '').strip()
        mid   = data.get('model', MODELS[0]['id'] if MODELS else 'unknown')
        model = next((m for m in MODELS if m['id'] == mid), None)
        if model is None:
            return jsonify({'error': f'Unknown model: {mid}'}), 400
        if model.get('_disabled'):
            return jsonify({'error': model.get('_disabled_reason', 'Model unavailable')}), 503
        if not _allowed(msg):
            return jsonify({'blocked': True, 'response': 'I can only answer questions about Red Hat technologies, AI/ML, and ISO standards.'})
        token = _get_token(model.get('auth', 'none'))
        if not token and model.get('auth') != 'none':
            return jsonify({'error': f'No credentials for model {mid}'}), 503
        try:
            client = openai.OpenAI(base_url=model['url'], api_key=token or 'none')
            resp = client.chat.completions.create(
                model=mid,
                messages=[{"role": "system", "content": SYSTEM_PROMPT}, {"role": "user", "content": msg}],
                max_tokens=2048,
                temperature=0.7,
            )
            content = resp.choices[0].message.content
            tokens  = resp.usage.total_tokens if resp.usage else None
            return jsonify({'response': content, 'model': mid, 'blocked': False, 'tokens': tokens})
        except Exception as exc:
            return jsonify({'error': str(exc)[:300]}), 500

    @app.route('/status')
    def status():
        return jsonify({'trustyai': _trustyai_status(), 'guardrails': _guardrails_status(), 'models': len([m for m in MODELS if not m.get('_disabled')])})

    @app.route('/health')
    def health():
        return jsonify({
            'status': 'healthy',
            'maas_token': MAAS_TOKEN_FILE.exists(),
            'openai_key': bool(OPENAI_KEY),
            'models': len(MODELS),
            'models_available': len([m for m in MODELS if not m.get('_disabled')]),
            'trustyai_url': TRUSTYAI_URL,
            'rhoai_url': RHOAI_URL,
        })

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8080)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playground
    spec:
      serviceAccountName: default
      containers:
        - name: playground
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["sh", "-c", "pip install flask openai httpx --quiet && python /app/app.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
            - name: maas-token
              mountPath: /var/run/secrets/maas
              readOnly: true
          # Models config (URLs, labels, providers) — no secrets
          envFrom:
            - configMapRef:
                name: playground-models-config
          env:
            # OpenAI API key from secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 30
      volumes:
        - name: app
          configMap:
            name: playground-app
        - name: maas-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: maas-default-gateway-sa
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
spec:
  selector:
    app.kubernetes.io/name: playground
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
  annotations:
    haproxy.router.openshift.io/timeout: "120s"
spec:
  to:
    kind: Service
    name: playground
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
