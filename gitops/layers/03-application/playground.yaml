---
# Unified AI Playground — all models in one UI
# All configuration (model list, URLs, prompts) is external via ConfigMaps/Secrets.
# App.py reads MODELS_CONFIG JSON at startup — zero hardcoded endpoints.
apiVersion: v1
kind: ConfigMap
metadata:
  name: playground-app
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: playground
data:
  app.py: |
    """Unified ISO Compliance AI Playground.

    Configuration is fully external:
      MODELS_CONFIG       JSON array of model descriptors (from playground-models-config)
      SYSTEM_PROMPT       LLM system prompt
      ALLOWED_TOPICS      comma-separated keyword allow-list for topic guardrails
      RHOAI_DASHBOARD_URL RHOAI dashboard link
      TRUSTYAI_URL        internal TrustyAI REST endpoint
      OPENAI_API_KEY      secret (optional, for OpenAI models)
      MaaS token          projected SA token at /var/run/secrets/maas/token
    """
    from __future__ import annotations
    import os, json, time, base64, threading, uuid
    from collections import defaultdict
    from pathlib import Path
    from flask import Flask, request, jsonify, render_template_string
    import openai, httpx
    import redis

    app = Flask(__name__)

    # ── config ─────────────────────────────────────────────────────────────
    MAAS_TOKEN_FILE = Path("/var/run/secrets/maas/token")
    OPENAI_KEY      = os.getenv("OPENAI_API_KEY", "")
    MAAS_BASE_URL   = os.getenv("MAAS_BASE_URL", "").rstrip("/")
    RHOAI_URL       = os.getenv("RHOAI_DASHBOARD_URL", "")
    TRUSTYAI_URL    = os.getenv("TRUSTYAI_URL", "")
    TITLE           = os.getenv("PLAYGROUND_TITLE", "AI Playground")
    SUBTITLE        = os.getenv("PLAYGROUND_SUBTITLE", "Red Hat OpenShift AI")

    ALLOWED_TOPICS  = [t.strip() for t in os.getenv("ALLOWED_TOPICS", "").split(",") if t.strip()]
    TOPIC_FILTER_MODE = os.getenv("TOPIC_FILTER_MODE", "allow_all").strip().lower()
    DEFAULT_MODEL_ID = os.getenv("DEFAULT_MODEL_ID", "").strip()
    SYSTEM_PROMPT   = os.getenv("SYSTEM_PROMPT", "You are a helpful assistant.")
    ANY_SUBJECT_SYSTEM_PROMPT = os.getenv(
        "ANY_SUBJECT_SYSTEM_PROMPT",
        "You are a general-purpose assistant. You may answer across any subject while staying factual and concise.",
    )
    CV_SYSTEM_PROMPT = os.getenv(
        "CV_SYSTEM_PROMPT",
        "You are a CV and hiring analyst. Evaluate resumes against requested criteria with practical, evidence-based recommendations.",
    )
    GUARDRAIL_DEFAULT_MODE = os.getenv("GUARDRAIL_DEFAULT_MODE", "iso_only").strip().lower()
    CV_ALLOWED_KEYWORDS = [
        t.strip().lower()
        for t in os.getenv(
            "CV_ALLOWED_KEYWORDS",
            "cv,resume,curriculum vitae,cover letter,job,position,candidate,skills,experience,education,"
            "קורות חיים,מועמד,משרה,ניסיון,השכלה,"
            "سيرة ذاتية,وظيفة,مرشح,مهارات,خبرة,تعليم",
        ).split(",")
        if t.strip()
    ]
    SPEECH_SUMMARY_PROMPT = os.getenv(
        "SPEECH_SUMMARY_PROMPT",
        "Summarize the transcript into concise actionable bullets. Keep ISO and Red Hat context.",
    )
    SPEECH_RECOGNITION_LANG = os.getenv("SPEECH_RECOGNITION_LANG", "he-IL")
    STT_SERVICE_URL = os.getenv("STT_SERVICE_URL", "http://playground-stt:8080").rstrip("/")
    STT_TIMEOUT_SEC = int(os.getenv("STT_TIMEOUT_SEC", "240"))
    STT_MAAS_TIMEOUT_SEC = int(os.getenv("STT_MAAS_TIMEOUT_SEC", str(min(STT_TIMEOUT_SEC, 45))))
    STT_MAX_AUDIO_MB = int(os.getenv("STT_MAX_AUDIO_MB", "100"))
    STT_ASYNC_DEFAULT = os.getenv("STT_ASYNC_DEFAULT", "true").strip().lower() not in ("0", "false", "no")
    STT_JOB_TTL_SEC = int(os.getenv("STT_JOB_TTL_SEC", "7200"))
    REDIS_URL = os.getenv("REDIS_URL", "redis://iso-redis:6379/1").strip()
    STT_DEFAULT_MODEL_ID = os.getenv("STT_DEFAULT_MODEL_ID", "local-whisper")
    STT_DISCOVER_MAAS_WHISPER = os.getenv("STT_DISCOVER_MAAS_WHISPER", "true").strip().lower() not in ("0", "false", "no")
    STT_EXPOSE_LOCAL_MODEL = os.getenv("STT_EXPOSE_LOCAL_MODEL", "false").strip().lower() in ("1", "true", "yes")
    STT_MAAS_MODEL_IDS = [m.strip() for m in os.getenv("STT_MAAS_MODEL_IDS", "").split(",") if m.strip()]
    FILE_ANALYSIS_SYSTEM_PROMPT = os.getenv(
        "FILE_ANALYSIS_SYSTEM_PROMPT",
        "You are an expert ISO compliance analyst. Analyze the uploaded file according to the user's criteria and provide practical findings.",
    )
    FILE_ANALYSIS_MAX_MB = int(os.getenv("FILE_ANALYSIS_MAX_MB", "25"))
    FILE_ANALYSIS_MAX_CHARS = int(os.getenv("FILE_ANALYSIS_MAX_CHARS", "22000"))
    FILE_PARSE_LANGUAGE = os.getenv("FILE_PARSE_LANGUAGE", "he")
    DOC_PARSE_AGENT_URL = os.getenv("DOC_PARSE_AGENT_URL", "http://iso-doc-parse-rag:8080").rstrip("/")
    USAGE = defaultdict(lambda: {"requests": 0, "blocked": 0, "errors": 0, "tokens": 0})
    STT_JOBS: dict[str, dict] = {}
    STT_JOBS_LOCK = threading.Lock()
    STT_REDIS_PREFIX = "playground:sttjob:"
    STT_REDIS = None
    if REDIS_URL:
        try:
            STT_REDIS = redis.Redis.from_url(REDIS_URL, decode_responses=True, socket_timeout=1)
            STT_REDIS.ping()
        except Exception:
            STT_REDIS = None

    def _load_models() -> list[dict]:
        raw = os.getenv("MODELS_CONFIG", "[]")
        try:
            models = json.loads(raw)
            maas_token = MAAS_TOKEN_FILE.read_text().strip() if MAAS_TOKEN_FILE.exists() else ""
            result = []
            for m in models:
                auth = m.get("auth", "none")
                if auth == "openai_key" and not OPENAI_KEY:
                    m["_disabled"] = True
                    m["_disabled_reason"] = "OPENAI_API_KEY not set"
                elif auth == "maas_token" and not maas_token:
                    m["_disabled"] = True
                    m["_disabled_reason"] = "MaaS SA token not available"
                else:
                    m["_disabled"] = False
                result.append(m)
            return result
        except Exception as exc:
            return [{"id": "error", "label": f"Config error: {exc}", "_disabled": True}]

    MODELS = _load_models()

    def _get_token(auth_type: str) -> str:
        if auth_type == "openai_key":
            return OPENAI_KEY
        if auth_type == "maas_token":
            if MAAS_TOKEN_FILE.exists():
                return MAAS_TOKEN_FILE.read_text().strip()
        return ""

    STT_MODELS_CACHE: dict[str, object] = {"ts": 0.0, "items": []}

    def _local_stt_model_descriptor() -> dict:
        local_label = f"Whisper Local ({os.getenv('STT_MODEL_NAME', 'small')})"
        return {
            "id": "local-whisper",
            "label": local_label,
            "provider": "local",
            "type": "local",
            "languages": ["en", "he", "ar"],
        }

    def _discover_stt_models() -> list[dict]:
        models: list[dict] = []
        if not (STT_DISCOVER_MAAS_WHISPER and MAAS_BASE_URL):
            return [_local_stt_model_descriptor()]

        token = _get_token("maas_token")
        if not token:
            return models
        try:
            resp = httpx.get(
                f"{MAAS_BASE_URL}/v1/models",
                headers={"Authorization": f"Bearer {token}"},
                timeout=8,
                verify=False,
            )
            if resp.status_code != 200:
                return models
            body = resp.json()
            for item in body.get("data", []):
                model_id = str(item.get("id", "")).strip()
                if not model_id:
                    continue
                low = model_id.lower()
                if "whisper" not in low and "speech" not in low:
                    continue
                raw_url = str(item.get("url", "")).strip()
                if raw_url:
                    base = raw_url.rstrip("/")
                    if not base.endswith("/v1"):
                        base = f"{base}/v1"
                else:
                    base = f"{MAAS_BASE_URL}/llm/{model_id}/v1"
                models.append(
                    {
                        "id": model_id,
                        "label": f"{model_id} (MaaS)",
                        "provider": "rhoai",
                        "type": "maas",
                        "url": base,
                        "languages": ["en", "he", "ar"],
                    }
                )
        except Exception:
            # If MaaS discovery fails, keep local whisper available.
            return [_local_stt_model_descriptor()]
        existing = {m.get("id") for m in models}
        if MAAS_BASE_URL:
            for model_id in STT_MAAS_MODEL_IDS:
                if model_id in existing:
                    continue
                models.append(
                    {
                        "id": model_id,
                        "label": f"{model_id} (MaaS)",
                        "provider": "rhoai",
                        "type": "maas",
                        "url": f"{MAAS_BASE_URL}/llm/{model_id}/v1",
                        "languages": ["en", "he", "ar"],
                    }
                )
        # UX default: show only MaaS whisper in normal mode.
        # Keep local whisper visible only if explicitly requested or when no MaaS whisper exists.
        if STT_EXPOSE_LOCAL_MODEL or not models:
            models.insert(0, _local_stt_model_descriptor())
        return models

    def _stt_models(force_refresh: bool = False) -> list[dict]:
        now = time.time()
        ts = float(STT_MODELS_CACHE.get("ts", 0.0) or 0.0)
        items = STT_MODELS_CACHE.get("items") or []
        if force_refresh or not items or now - ts > 60:
            items = _discover_stt_models()
            STT_MODELS_CACHE["ts"] = now
            STT_MODELS_CACHE["items"] = items
        return list(items)

    def _stt_model_by_id(model_id: str) -> dict | None:
        wanted = (model_id or "").strip()
        for m in _stt_models():
            if m.get("id") == wanted:
                return m
        return None

    # ── TrustyAI status ────────────────────────────────────────────────────
    def _trustyai_status() -> dict:
        if not TRUSTYAI_URL:
            return {"available": False, "reason": "TRUSTYAI_URL not configured"}
        try:
            resp = httpx.get(f"{TRUSTYAI_URL}/q/health", timeout=3, verify=False)
            data = resp.json()
            checks = {c["name"]: c["status"] for c in data.get("checks", [])}
            return {
                "available": data.get("status") == "UP",
                "status": data.get("status", "UNKNOWN"),
                "liveness": checks.get("Liveness", "?"),
                "data": checks.get("Data", "?"),
            }
        except Exception as exc:
            return {"available": False, "reason": str(exc)[:80]}

    def _guardrails_status() -> dict:
        """Check TrustyAI GuardrailsOrchestrator.
        Application-level topic guardrails are always active (keyword filter).
        The orchestrator provides additional HAP (hate/abuse/profanity) detection.
        """
        url = os.getenv("GUARDRAILS_ORCHESTRATOR_URL", "")
        topic_filter_enabled = TOPIC_FILTER_MODE in ("on", "enforce", "strict", "true", "1")
        # App-level guardrails remain active (guardrails orchestration can be unavailable).
        base = {"app_guardrails": True, "topic_filter": topic_filter_enabled}
        if not url:
            return {**base, "available": False, "note": "Orchestrator URL not configured"}
        try:
            resp = httpx.get(f"{url}/health", timeout=2, verify=False)
            if resp.status_code == 200:
                return {**base, "available": True, "hap_detector": True}
            return {**base, "available": False, "note": f"Orchestrator HTTP {resp.status_code}"}
        except Exception as exc:
            # Known limitation: fms-guardrails-orchestr8r uses NLP/gRPC protocol;
            # vLLM (LLMInferenceService) uses REST/OpenAI — protocol mismatch causes crash.
            # App-level guardrails remain fully active.
            return {**base, "available": False, "note": "Protocol config (app guardrails active)"}

    def _stt_status() -> dict:
        stt_models = _stt_models()
        if not STT_SERVICE_URL:
            return {"available": False, "reason": "STT_SERVICE_URL not configured", "models": stt_models}
        try:
            resp = httpx.get(f"{STT_SERVICE_URL}/health", timeout=3, verify=False)
            if resp.status_code != 200:
                return {"available": False, "reason": f"HTTP {resp.status_code}", "models": stt_models}
            data = resp.json()
            whisper_maas = [m.get("id") for m in stt_models if m.get("type") == "maas"]
            return {
                "available": data.get("status") == "healthy",
                "model_name": data.get("model_name", "?"),
                "model_device": data.get("model_device", "?"),
                "model_loaded": bool(data.get("model_loaded", False)),
                "models": stt_models,
                "whisper_maas_models": whisper_maas,
            }
        except Exception as exc:
            return {"available": False, "reason": str(exc)[:80], "models": stt_models}

    def _extract_text_from_uploaded_file(filename: str, data: bytes, language: str) -> tuple[str, dict]:
        ext = Path(filename).suffix.lower()
        meta = {"source": ext or "unknown", "parse_method": "direct", "model_used": None, "warnings": []}
        if ext in {".txt", ".md", ".csv", ".log", ".yaml", ".yml"}:
            return data.decode("utf-8", errors="replace"), meta
        if ext == ".json":
            try:
                obj = json.loads(data.decode("utf-8", errors="replace"))
                return json.dumps(obj, ensure_ascii=False, indent=2), meta
            except Exception:
                return data.decode("utf-8", errors="replace"), meta
        if ext in {".pdf", ".doc", ".docx"}:
            payload = {
                "filename": filename,
                "content_b64": base64.b64encode(data).decode("ascii"),
                "standard": "ISO9001",
                "language": language or FILE_PARSE_LANGUAGE,
                "task": "general",
            }
            resp = httpx.post(f"{DOC_PARSE_AGENT_URL}/parse", json=payload, timeout=max(STT_TIMEOUT_SEC, 240), verify=False)
            try:
                body = resp.json()
            except Exception:
                body = {}
            if resp.status_code >= 400:
                err = None
                if isinstance(body, dict):
                    err = body.get("error") or body.get("detail")
                    if isinstance(err, dict):
                        err = json.dumps(err, ensure_ascii=False)
                    elif isinstance(err, list):
                        err = "; ".join(str(x) for x in err if x)
                raise RuntimeError(err or f"doc parser error {resp.status_code}")
            if isinstance(body, dict):
                for key in ("raw_text", "text", "content", "document_text"):
                    val = body.get(key)
                    if isinstance(val, str) and val.strip():
                        meta.update(
                            {
                                "parse_method": body.get("parse_method", "doc-parser"),
                                "model_used": body.get("model_used"),
                                "warnings": body.get("warnings", []),
                            }
                        )
                        return val.strip(), meta

            clauses = (body.get("clauses") or []) if isinstance(body, dict) else []
            parts: list[str] = []
            for item in clauses:
                if isinstance(item, dict):
                    found = False
                    for key in ("text", "content", "title", "clause_text", "requirement", "body"):
                        val = item.get(key)
                        if isinstance(val, str) and val.strip():
                            parts.append(val.strip())
                            found = True
                            break
                    if not found:
                        parts.append(json.dumps(item, ensure_ascii=False))
                else:
                    parts.append(str(item))
            if not parts and isinstance(body, dict):
                sheets = body.get("sheets") or []
                for sheet in sheets:
                    if not isinstance(sheet, dict):
                        continue
                    rows = sheet.get("rows") or []
                    for row in rows:
                        if not isinstance(row, dict):
                            if str(row).strip():
                                parts.append(str(row).strip())
                            continue
                        for key in ("line", "text", "value", "content"):
                            val = row.get(key)
                            if isinstance(val, str) and val.strip():
                                parts.append(val.strip())
                                break
            text = "\n".join(parts).strip()
            if not text:
                raise RuntimeError("doc parser returned no text")
            meta.update(
                {
                    "parse_method": body.get("parse_method", "doc-parser") if isinstance(body, dict) else "doc-parser",
                    "model_used": body.get("model_used") if isinstance(body, dict) else None,
                    "warnings": body.get("warnings", []) if isinstance(body, dict) else [],
                }
            )
            return text, meta
        raise RuntimeError(f"unsupported file type: {ext or 'unknown'}")

    def _looks_like_cv(criteria: str = "", filename: str = "", extracted_text: str = "") -> bool:
        scope_text = f"{criteria} {filename}".lower()
        if any(kw in scope_text for kw in CV_ALLOWED_KEYWORDS):
            return True
        sample = (extracted_text or "")[:8000].lower()
        if not sample:
            return False
        for strong_marker in ("curriculum vitae", "resume", "קורות חיים", "سيرة ذاتية"):
            if strong_marker in sample:
                return True
        section_terms = (
            "experience", "education", "skills", "employment", "summary", "objective",
            "ניסיון", "השכלה", "כישורים", "תעסוקה",
            "خبرة", "تعليم", "مهارات", "السيرة",
        )
        hits = sum(1 for term in section_terms if term in sample)
        return hits >= 3

    def _resolve_guardrail_mode(mode: str, criteria: str = "", filename: str = "", extracted_text: str = "") -> str:
        selected = (mode or GUARDRAIL_DEFAULT_MODE or "iso_only").strip().lower()
        if selected not in ("iso_only", "cv_analysis", "speech_any_subject", "cv", "any_subject", "speech_any"):
            selected = "iso_only"
        if selected in ("cv",):
            return "cv_analysis"
        if selected in ("any_subject", "speech_any"):
            return "speech_any_subject"
        if selected == "iso_only" and _looks_like_cv(criteria=criteria, filename=filename, extracted_text=extracted_text):
            return "cv_analysis"
        return selected

    # ── topic guardrails ───────────────────────────────────────────────────
    def _allowed(msg: str, mode: str = "iso_only", filename: str = "") -> bool:
        if TOPIC_FILTER_MODE in ("off", "allow_all", "disabled", "false", "0"):
            return True
        low = (msg or "").lower()
        mode = _resolve_guardrail_mode(mode, criteria=msg, filename=filename)
        # Option 2: speech/text analyzer in any subject (user-selected mode).
        if mode in ("speech_any_subject", "any_subject", "speech_any"):
            return True
        # Option 1: CV analysis mode (user-selected mode).
        if mode in ("cv_analysis", "cv"):
            if filename:
                # In file analyzer flow, once CV mode is selected we allow
                # arbitrary matching criteria (role/domain can be any subject).
                return True
            return any(kw in low for kw in CV_ALLOWED_KEYWORDS)
        # Default: ISO/Red Hat scoped mode.
        return any(kw in low for kw in ALLOWED_TOPICS)

    def _system_prompt_for_mode(mode: str) -> str:
        mode = (mode or "iso_only").strip().lower()
        if mode in ("speech_any_subject", "any_subject", "speech_any"):
            return ANY_SUBJECT_SYSTEM_PROMPT
        if mode in ("cv_analysis", "cv"):
            return CV_SYSTEM_PROMPT
        return SYSTEM_PROMPT

    def _error_text(value, fallback: str) -> str:
        if isinstance(value, str) and value.strip():
            return value.strip()
        if isinstance(value, dict):
            for key in ("message", "error", "detail", "msg"):
                candidate = value.get(key)
                if isinstance(candidate, str) and candidate.strip():
                    return candidate.strip()
            try:
                return json.dumps(value, ensure_ascii=False)[:240]
            except Exception:
                return fallback
        if isinstance(value, list):
            parts = [_error_text(v, "") for v in value]
            joined = "; ".join(p for p in parts if p)
            return joined or fallback
        return fallback

    def _friendly_stt_error(err_text: str) -> tuple[str, int]:
        raw = (err_text or "").strip()
        low = raw.lower()
        unsupported_markers = (
            "invalid data found when processing input",
            "unsupported",
            "unknown input format",
            "could not find codec parameters",
            "error decoding",
            "tuple index out of range",
            "invalid audio",
            "codec",
            "container",
        )
        if any(marker in low for marker in unsupported_markers):
            return (
                "Unsupported or invalid audio format/codec. Upload audio-only WAV, MP3, M4A, OGG, or FLAC.",
                422,
            )
        return (raw or "transcription failed", 500)

    def _cleanup_stt_jobs() -> None:
        if STT_REDIS:
            return
        now = time.time()
        with STT_JOBS_LOCK:
            stale_ids = [
                job_id
                for job_id, item in STT_JOBS.items()
                if now - float(item.get("updated_at", item.get("created_at", now))) > STT_JOB_TTL_SEC
            ]
            for job_id in stale_ids:
                STT_JOBS.pop(job_id, None)

    def _set_stt_job(job_id: str, payload: dict) -> None:
        payload = dict(payload)
        payload.setdefault("created_at", time.time())
        payload["updated_at"] = time.time()
        if STT_REDIS:
            try:
                STT_REDIS.setex(STT_REDIS_PREFIX + job_id, STT_JOB_TTL_SEC, json.dumps(payload, ensure_ascii=False))
                return
            except Exception:
                pass
        with STT_JOBS_LOCK:
            STT_JOBS[job_id] = payload

    def _get_stt_job(job_id: str) -> dict | None:
        if STT_REDIS:
            try:
                raw = STT_REDIS.get(STT_REDIS_PREFIX + job_id)
                if not raw:
                    return None
                if isinstance(raw, bytes):
                    raw = raw.decode("utf-8", errors="ignore")
                val = json.loads(raw)
                return dict(val) if isinstance(val, dict) else None
            except Exception:
                return None
        with STT_JOBS_LOCK:
            item = STT_JOBS.get(job_id)
            return dict(item) if item else None

    def _transcribe_audio_bytes(
        audio_filename: str,
        audio_bytes: bytes,
        audio_mimetype: str,
        language: str,
        selected_model_id: str,
    ) -> tuple[dict, int]:
        stt_model = _stt_model_by_id(selected_model_id)
        if stt_model is None:
            return {"error": f"unknown stt model: {selected_model_id}"}, 400

        payload = {"audio": (audio_filename, audio_bytes, audio_mimetype or "application/octet-stream")}
        form = {}
        if language:
            form["language"] = language

        def _transcribe_local(fallback_note: str = "") -> tuple[dict, int]:
            try:
                local_resp = httpx.post(
                    f"{STT_SERVICE_URL}/v1/transcribe",
                    files=payload,
                    data=form,
                    timeout=STT_TIMEOUT_SEC,
                    verify=False,
                )
                try:
                    local_body = local_resp.json()
                except Exception:
                    local_body = {}
            except Exception as exc:
                return {"error": f"stt service unreachable: {str(exc)[:120]}"}, 502
            if local_resp.status_code >= 400:
                err = _error_text(
                    local_body.get("error") if isinstance(local_body, dict) else None,
                    f"stt request failed (HTTP {local_resp.status_code})",
                )
                friendly_err, mapped_status = _friendly_stt_error(err)
                status_code = local_resp.status_code
                if mapped_status == 422 and status_code >= 500:
                    status_code = 422
                return {"error": friendly_err, "details": local_body}, status_code
            if isinstance(local_body, dict):
                local_body["provider"] = "local"
                if fallback_note:
                    local_body["fallback_note"] = fallback_note
            return local_body if isinstance(local_body, dict) else {"transcript": ""}, 200

        if stt_model.get("type") == "maas":
            maas_token = _get_token("maas_token")
            if not maas_token:
                return _transcribe_local("MaaS token unavailable; used local STT.")
            stt_url = str(stt_model.get("url", "")).rstrip("/")
            if not stt_url:
                return _transcribe_local("MaaS STT endpoint missing; used local STT.")
            form["model"] = selected_model_id
            try:
                resp = httpx.post(
                    f"{stt_url}/audio/transcriptions",
                    files={"file": payload["audio"]},
                    data=form,
                    headers={"Authorization": f"Bearer {maas_token}"},
                    timeout=STT_MAAS_TIMEOUT_SEC,
                    verify=False,
                )
                try:
                    body = resp.json()
                except Exception:
                    body = {}
            except Exception as exc:
                return _transcribe_local(f"MaaS STT request failed ({str(exc)[:80]}); used local STT.")
            if resp.status_code >= 400:
                err = _error_text(
                    body.get("error") if isinstance(body, dict) else None,
                    f"maas whisper failed (HTTP {resp.status_code})",
                )
                friendly_err, mapped_status = _friendly_stt_error(err)
                if resp.status_code >= 500:
                    return _transcribe_local(f"MaaS STT HTTP {resp.status_code}; used local STT.")
                status_code = resp.status_code
                if mapped_status == 422:
                    status_code = 422
                return {"error": friendly_err, "details": body}, status_code
            transcript = (body.get("text") or body.get("transcript") or "").strip()
            if not transcript:
                return _transcribe_local("MaaS STT returned empty transcript; used local STT.")
            return {
                "transcript": transcript,
                "detected_language": body.get("language") or language or "unknown",
                "duration_seconds": body.get("duration"),
                "model_name": selected_model_id,
                "provider": "maas",
            }, 200

        return _transcribe_local()

    def _run_stt_job(
        job_id: str,
        audio_filename: str,
        audio_bytes: bytes,
        audio_mimetype: str,
        language: str,
        selected_model_id: str,
    ) -> None:
        result, status_code = _transcribe_audio_bytes(
            audio_filename=audio_filename,
            audio_bytes=audio_bytes,
            audio_mimetype=audio_mimetype,
            language=language,
            selected_model_id=selected_model_id,
        )
        if status_code >= 400:
            _set_stt_job(job_id, {"status": "failed", "http_status": status_code, "result": result})
            return
        _set_stt_job(job_id, {"status": "done", "http_status": 200, "result": result})

    # ── HTML ───────────────────────────────────────────────────────────────
