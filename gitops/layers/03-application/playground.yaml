---
# AI Playground — connects to Qwen3 4B Instruct via RHOAI MaaS
# Auth: uses the pod's default ServiceAccount token (system:authenticated → free tier)
# Guardrails: routes through GuardrailsOrchestrator when GUARDRAILS_ENDPOINT is set
apiVersion: v1
kind: ConfigMap
metadata:
  name: playground-app
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: playground
data:
  app.py: |
    """ISO Compliance AI Playground — Qwen3 4B via RHOAI MaaS + OpenAI fallback."""
    from __future__ import annotations
    import os, json
    from pathlib import Path
    from flask import Flask, request, jsonify, render_template_string
    import openai

    app = Flask(__name__)

    MAAS_BASE = os.getenv("MAAS_BASE_URL", "https://maas.apps.ocp.8mkwb.sandbox3159.opentlc.com")
    MAAS_MODEL = os.getenv("MAAS_MODEL_LOCAL", "qwen3-4b-instruct")
    OPENAI_KEY = os.getenv("OPENAI_API_KEY", "")
    GUARDRAILS_ENDPOINT = os.getenv("GUARDRAILS_ENDPOINT", "")
    RHOAI_DASHBOARD = os.getenv("RHOAI_DASHBOARD_URL", "https://rhods-dashboard-redhat-ods-applications.apps.ocp.8mkwb.sandbox3159.opentlc.com")

    # MaaS Kuadrant gateway requires tokens with audience "maas-default-gateway-sa"
    # We mount a projected token with that audience at /var/run/secrets/maas/token
    SA_TOKEN_FILE = Path("/var/run/secrets/maas/token")

    def get_sa_token() -> str:
        if SA_TOKEN_FILE.exists():
            return SA_TOKEN_FILE.read_text().strip()
        return ""

    MODELS = {
        "qwen3-4b-instruct": {
            "label": "Qwen3 4B Instruct (RHOAI MaaS — local GPU)",
            "base_url": f"{MAAS_BASE}/llm/{MAAS_MODEL}/v1",
            "api_key_fn": get_sa_token,
            "provider": "rhoai",
        },
    }
    if OPENAI_KEY:
        MODELS.update({
            "gpt-4o": {"label": "GPT-4o (OpenAI)", "base_url": "https://api.openai.com/v1", "api_key_fn": lambda: OPENAI_KEY, "provider": "openai"},
            "gpt-4o-mini": {"label": "GPT-4o Mini (OpenAI)", "base_url": "https://api.openai.com/v1", "api_key_fn": lambda: OPENAI_KEY, "provider": "openai"},
        })

    SYSTEM_PROMPT = """You are an AI assistant specialized in Red Hat technologies and ISO standards.
    STRICT RULES:
    1. ONLY answer questions about Red Hat products (RHEL, OpenShift, Ansible, RHOAI, etc.) and ISO standards (ISO 27001, ISO 9001, ISO 20000, etc.).
    2. For ANY other topic, respond: "I can only answer questions about Red Hat technologies and ISO standards."
    3. Do not engage with general knowledge, other vendors, or unrelated topics."""

    HTML = r'''<!DOCTYPE html><html><head>
    <title>ISO Compliance AI Playground</title>
    <meta charset="utf-8">
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;padding:20px}
    .container{max-width:1100px;margin:0 auto;background:white;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
    .header{background:linear-gradient(135deg,#ee0000 0%,#a00000 100%);color:white;padding:24px 32px;display:flex;align-items:center;gap:16px}
    .header h1{font-size:24px;font-weight:700}
    .header p{opacity:.85;font-size:13px;margin-top:4px}
    .rhoai-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:12px;text-decoration:none;color:white;white-space:nowrap}
    .rhoai-badge:hover{background:rgba(255,255,255,.25)}
    .info-bar{background:#f8f9fa;padding:12px 32px;display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid #e9ecef;font-size:13px}
    .info-item{display:flex;align-items:center;gap:8px;color:#495057}
    .dot{width:8px;height:8px;border-radius:50%}
    .dot-green{background:#28a745} .dot-red{background:#ee0000} .dot-grey{background:#6c757d}
    .body{padding:24px 32px}
    .model-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
    .model-row label{font-weight:600;font-size:14px;color:#343a40}
    select{padding:8px 12px;border:2px solid #dee2e6;border-radius:8px;font-size:14px;background:white;cursor:pointer;min-width:280px}
    select:focus{outline:none;border-color:#ee0000}
    .provider-badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
    .provider-rhoai{background:#e8f4fd;color:#1565c0}
    .provider-openai{background:#e8f5e9;color:#2e7d32}
    textarea{width:100%;min-height:110px;padding:14px;border:2px solid #dee2e6;border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;transition:border-color .2s}
    textarea:focus{outline:none;border-color:#ee0000}
    .btn-row{display:flex;gap:10px;margin-top:12px}
    button{padding:12px 28px;font-size:15px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:.2s}
    .btn-send{background:linear-gradient(135deg,#ee0000,#a00000);color:white}
    .btn-send:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(238,0,0,.35)}
    .btn-send:disabled{background:#ccc;cursor:not-allowed;transform:none}
    .btn-clear{background:#f8f9fa;color:#495057;border:1px solid #dee2e6}
    .response{background:#fff;border:2px solid #dee2e6;border-radius:10px;padding:20px;min-height:160px;margin-top:20px;line-height:1.7;white-space:pre-wrap;font-size:14px}
    .response.loading{display:flex;align-items:center;justify-content:center;color:#666}
    .response.error{border-color:#f5c6cb;background:#fff5f5;color:#721c24}
    .response.blocked{border-color:#ffc107;background:#fffdf0;color:#856404}
    .response.ok{border-color:#c3e6cb;background:#f0fff4}
    .spinner{border:3px solid #f3f3f3;border-top:3px solid #ee0000;border-radius:50%;width:32px;height:32px;animation:spin .9s linear infinite;margin-right:12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .meta{margin-top:8px;font-size:12px;color:#6c757d}
    .guardrails-notice{background:#e8f4fd;border:1px solid #bee5eb;border-radius:8px;padding:12px 16px;font-size:13px;color:#0c5460;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    </style></head><body>
    <div class="container">
      <div class="header">
        <div style="flex:1">
          <h1>🤖 ISO Compliance AI Playground</h1>
          <p>Powered by Qwen3 4B Instruct on Red Hat OpenShift AI · MaaS Gateway</p>
        </div>
        <a class="rhoai-badge" href="RHOAI_DASHBOARD_PLACEHOLDER" target="_blank">📊 RHOAI Dashboard</a>
      </div>
      <div class="info-bar">
        <div class="info-item"><div class="dot dot-green"></div><span id="modelStatus">Model: loading…</span></div>
        <div class="info-item"><div class="dot dot-red"></div><span>Guardrails: <span id="guardrailsStatus">enabled</span></span></div>
        <div class="info-item"><div class="dot dot-grey"></div><span>Provider: <span id="providerLabel">RHOAI MaaS</span></span></div>
        <div class="info-item"><span>Context: 131 072 tokens</span></div>
      </div>
      <div class="body">
        <div class="guardrails-notice">🛡️ <strong>TrustyAI Guardrails active</strong> — requests are filtered for Red Hat + ISO topics. All inferences are logged for drift monitoring.</div>
        <div class="model-row">
          <label for="modelSel">Model:</label>
          <select id="modelSel" onchange="onModelChange()">MODELS_PLACEHOLDER</select>
          <span id="providerBadge" class="provider-badge provider-rhoai">RHOAI MaaS</span>
        </div>
        <textarea id="prompt" placeholder="Ask about Red Hat products or ISO standards…">What is Red Hat OpenShift AI and how does it support ISO 27001 compliance?</textarea>
        <div class="btn-row">
          <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
          <button class="btn-clear" onclick="document.getElementById('prompt').value='';document.getElementById('response').className='response';document.getElementById('response').textContent='Response will appear here…'">Clear</button>
        </div>
        <div id="response" class="response">Response will appear here…</div>
        <div id="meta" class="meta"></div>
      </div>
    </div>
    <script>
    const MODELS_DATA = MODELS_JSON_PLACEHOLDER;
    function onModelChange(){
      const m=document.getElementById('modelSel').value;
      const p=MODELS_DATA[m]||{};
      document.getElementById('providerLabel').textContent=p.provider==='rhoai'?'RHOAI MaaS':'OpenAI';
      const b=document.getElementById('providerBadge');
      b.textContent=p.label||m;
      b.className='provider-badge '+(p.provider==='rhoai'?'provider-rhoai':'provider-openai');
      document.getElementById('modelStatus').textContent='Model: '+m;
    }
    onModelChange();
    async function sendMessage(){
      const prompt=document.getElementById('prompt').value.trim();
      if(!prompt)return;
      const model=document.getElementById('modelSel').value;
      const r=document.getElementById('response');
      const btn=document.getElementById('sendBtn');
      r.className='response loading';
      r.innerHTML='<div class="spinner"></div><span>Thinking…</span>';
      btn.disabled=true;
      document.getElementById('meta').textContent='';
      const t0=Date.now();
      try{
        const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:prompt,model})});
        const d=await res.json();
        const elapsed=((Date.now()-t0)/1000).toFixed(1);
        if(d.error){r.className='response error';r.textContent='Error: '+d.error;}
        else if(d.blocked){r.className='response blocked';r.textContent='🚫 Blocked by guardrails:\n\n'+d.response;}
        else{r.className='response ok';r.textContent=d.response;}
        document.getElementById('meta').textContent=`Model: ${d.model||model} · ${elapsed}s · ${d.tokens||'?'} tokens`;
      }catch(e){r.className='response error';r.textContent='Network error: '+e.message;}
      finally{btn.disabled=false;}
    }
    document.getElementById('prompt').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')sendMessage();});
    </script></body></html>'''

    @app.route('/')
    def home():
        options = "".join(f'<option value="{k}">{v["label"]}</option>' for k,v in MODELS.items())
        models_json = json.dumps({k: {"label": v["label"], "provider": v["provider"]} for k,v in MODELS.items()})
        html = HTML.replace("MODELS_PLACEHOLDER", options)\
                   .replace("MODELS_JSON_PLACEHOLDER", models_json)\
                   .replace("RHOAI_DASHBOARD_PLACEHOLDER", RHOAI_DASHBOARD)
        return html

    @app.route('/chat', methods=['POST'])
    def chat():
        data = request.json or {}
        user_msg = data.get('message', '').strip()
        model_id = data.get('model', list(MODELS.keys())[0])
        if model_id not in MODELS:
            model_id = list(MODELS.keys())[0]
        cfg = MODELS[model_id]
        allowed = ['red hat','rhel','openshift','ansible','rhoai','iso 27001','iso 9001','iso 20000','iso','compliance','certification','security','audit','standards','qwen','openshift ai']
        if not any(kw in user_msg.lower() for kw in allowed):
            return jsonify({'blocked': True, 'response': 'I can only answer questions about Red Hat technologies and ISO standards.'})
        try:
            client = openai.OpenAI(base_url=cfg["base_url"], api_key=cfg["api_key_fn"]())
            resp = client.chat.completions.create(
                model=model_id,
                messages=[{"role": "system", "content": SYSTEM_PROMPT}, {"role": "user", "content": user_msg}],
                max_tokens=2048,
                temperature=0.7,
            )
            content = resp.choices[0].message.content
            tokens = resp.usage.total_tokens if resp.usage else None
            return jsonify({'response': content, 'model': model_id, 'blocked': False, 'tokens': tokens})
        except Exception as e:
            return jsonify({'error': str(e)}), 500

    @app.route('/health')
    def health():
        sa_token_present = SA_TOKEN_FILE.exists()
        return jsonify({
            'status': 'healthy',
            'maas_endpoint': f"{MAAS_BASE}/llm/{MAAS_MODEL}/v1",
            'sa_token_present': sa_token_present,
            'models': list(MODELS.keys()),
            'guardrails_endpoint': GUARDRAILS_ENDPOINT or 'via MaaS gateway',
            'rhoai_dashboard': RHOAI_DASHBOARD,
        })

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8080)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
    app.kubernetes.io/component: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playground
    spec:
      serviceAccountName: default
      containers:
        - name: playground
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["sh", "-c", "pip install flask openai --quiet && python /app/app.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
            - name: maas-token
              mountPath: /var/run/secrets/maas
              readOnly: true
          envFrom:
            - configMapRef:
                name: iso-app-config
                optional: true
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
                  optional: true
            - name: RHOAI_DASHBOARD_URL
              value: "https://rhods-dashboard-redhat-ods-applications.apps.ocp.8mkwb.sandbox3159.opentlc.com"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 30
      volumes:
        - name: app
          configMap:
            name: playground-app
        # Projected SA token with MaaS gateway audience for Kuadrant auth
        - name: maas-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: maas-default-gateway-sa
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
spec:
  selector:
    app.kubernetes.io/name: playground
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
  annotations:
    haproxy.router.openshift.io/timeout: "120s"
spec:
  to:
    kind: Service
    name: playground
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
