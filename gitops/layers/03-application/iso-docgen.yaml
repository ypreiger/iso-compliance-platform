apiVersion: apps/v1
kind: Deployment
metadata:
  name: iso-doc-parse-rag
  labels:
    app.kubernetes.io/name: iso-doc-parse-rag
    app.kubernetes.io/component: doc-parse-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iso-doc-parse-rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iso-doc-parse-rag
    spec:
      serviceAccountName: iso-platform
      containers:
        - name: iso-doc-parse-rag
          image: image-registry.openshift-image-registry.svc:5000/iso-platform/iso-docgen:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: iso-app-config
          env:
            - name: DOC_AGENT_MODE
              value: parse-rag
            - name: MAAS_BEARER_TOKEN_FILE
              value: /var/run/secrets/maas/token
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: maas-token
              mountPath: /var/run/secrets/maas
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: maas-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: maas-default-gateway-sa
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: iso-doc-parse-rag
spec:
  selector:
    app.kubernetes.io/name: iso-doc-parse-rag
  ports:
    - port: 8080
      targetPort: http
---
