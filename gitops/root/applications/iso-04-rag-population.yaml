apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iso-04-rag-population
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/part-of: iso-compliance-platform
spec:
  project: default
  source:
    repoURL: https://github.com/ypreiger/iso-compliance-platform.git
    targetRevision: main
    path: gitops/layers/04-rag-population
  destination:
    server: https://kubernetes.default.svc
    namespace: iso-platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
