# App of Apps — register once, then Argo manages all layers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iso-compliance-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: iso-compliance-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ypreiger/iso-compliance-platform.git
    targetRevision: main
    path: gitops/root
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
